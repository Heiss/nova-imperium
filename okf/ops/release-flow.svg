<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 940" width="960" height="940" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>Nova Imperium: release flow after #387 (owner, 2026-11-23); [V] = proposal</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <marker id="arrowred" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c43c3c"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #444; stroke-width: 1.4; }
      .dev { fill: #eef4ff; stroke: #3b6fd4; }
      .main { fill: #f3eefc; stroke: #7a4fc4; }
      .rel { fill: #fff6e6; stroke: #d48a1e; }
      .pub { fill: #eaf7ee; stroke: #2f8f4e; }
      .fix { fill: #fdecec; stroke: #c43c3c; }
      .lane { fill: none; stroke: #bbb; stroke-dasharray: 5 4; }
      .head { font-weight: bold; font-size: 14px; }
      .small { font-size: 11.5px; fill: #333; }
      .note { font-size: 11.5px; fill: #555; }
      .lanelabel { font-size: 12px; fill: #777; font-weight: bold; letter-spacing: 1px; }
      .flow { stroke: #444; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .hot { stroke: #c43c3c; stroke-width: 1.6; fill: none; marker-end: url(#arrowred); stroke-dasharray: 6 4; }
    </style>
  </defs>
  <rect width="960" height="940" fill="#ffffff"/>

  <!-- Lanes -->
  <rect class="lane" x="10" y="10" width="940" height="190" rx="10"/>
  <text class="lanelabel" text-anchor="end" x="938" y="30">1  EVERY PULL REQUEST INTO MAIN</text>
  <rect class="lane" x="10" y="212" width="940" height="250" rx="10"/>
  <text class="lanelabel" text-anchor="end" x="938" y="232">2  MAIN: AFTER EVERY MERGE AND EVERY NIGHT</text>
  <rect class="lane" x="10" y="474" width="940" height="180" rx="10"/>
  <text class="lanelabel" text-anchor="end" x="938" y="494">3  RELEASE PULL REQUEST (ON THE OWNER'S WORD)</text>
  <rect class="lane" x="10" y="666" width="940" height="110" rx="10"/>
  <text class="lanelabel" text-anchor="end" x="938" y="686">4  PUBLISH AND ROLL OUT</text>
  <rect class="lane" x="10" y="788" width="940" height="114" rx="10"/>
  <text class="lanelabel" text-anchor="end" x="938" y="808">HOTFIX (ONLY WHEN MAIN HOLDS UNRELEASED WORK)</text>

  <!-- Lane 1 -->
  <rect class="box dev" x="24" y="44" width="180" height="140" rx="8"/>
  <text class="head" x="36" y="66">Issue</text>
  <text class="small" x="36" y="88">label „ready“</text>
  <text class="small" x="36" y="104">clarified („Geklärt“)</text>
  <text class="small" x="36" y="128">a nightly failure comes</text>
  <text class="small" x="36" y="144">first (lane 2)</text>

  <rect class="box dev" x="230" y="44" width="220" height="140" rx="8"/>
  <text class="head" x="242" y="66">Short-lived branch + PR</text>
  <text class="small" x="242" y="88">code, tests, docs</text>
  <text class="small" x="242" y="110">changes/&lt;name&gt;.md (German,</text>
  <text class="small" x="242" y="126">art: neu / geändert / behoben),</text>
  <text class="small" x="242" y="142">or label „kein-changelog“</text>

  <rect class="box dev" x="476" y="44" width="270" height="140" rx="8"/>
  <text class="head" x="488" y="66">CI Gate of the PR</text>
  <text class="small" x="488" y="88">lint, types, complete unit suite</text>
  <text class="small" x="488" y="104">complete E2E, split over several jobs</text>
  <text class="small" x="488" y="120">mutation of the changed files</text>
  <text class="small" x="488" y="136">changelog fragments check</text>
  <text class="small" x="488" y="158">image, Trivy, Compose, upgrade test:</text>
  <text class="small" x="488" y="174">only when build or start files change</text>

  <rect class="box dev" x="772" y="44" width="164" height="140" rx="8"/>
  <text class="head" x="784" y="66">Squash merge</text>
  <text class="small" x="784" y="88">into main after a green</text>
  <text class="small" x="784" y="104">CI Gate and CodeRabbit</text>
  <text class="small" x="784" y="120">(O4)</text>
  <text class="small" x="784" y="144">No tag: main</text>
  <text class="small" x="784" y="160">only collects</text>

  <path class="flow" d="M204,114 H228"/>
  <path class="flow" d="M450,114 H474"/>
  <path class="flow" d="M746,114 H770"/>

  <!-- Lane 2, row A: after every merge -->
  <rect class="box main" x="24" y="246" width="260" height="102" rx="8"/>
  <text class="head" x="36" y="268">Push run on main</text>
  <text class="small" x="36" y="290">takes over what the PR proved</text>
  <text class="small" x="36" y="306">on the same tree (#342),</text>
  <text class="small" x="36" y="322">runs the rest</text>

  <rect class="box main" x="310" y="246" width="300" height="102" rx="8"/>
  <text class="head" x="322" y="268">Image „next“</text>
  <text class="small" x="322" y="290">after every green push run on main</text>
  <text class="small" x="322" y="306">linux/amd64 + linux/arm64</text>
  <text class="small" x="322" y="322">VERSION = short commit, OCI label</text>
  <text class="small" x="322" y="336">revision; the game shows no version</text>

  <rect class="box main" x="636" y="246" width="300" height="102" rx="8"/>
  <text class="head" x="648" y="268">Test server</text>
  <text class="small" x="648" y="290">NOVA_VERSION=next</text>
  <text class="small" x="648" y="306">always the newest state of main:</text>
  <text class="small" x="648" y="322">what the next release brings</text>

  <path class="flow" d="M854,184 V204 H154 V244"/>
  <path class="flow" d="M284,294 H308"/>
  <path class="flow" d="M610,294 H634"/>

  <!-- Lane 2, row B: every night -->
  <rect class="box main" x="24" y="356" width="440" height="92" rx="8"/>
  <text class="head" x="36" y="378">Complete run, every night on main</text>
  <text class="small" x="36" y="400">unit suite, complete E2E, complete mutation run (floors),</text>
  <text class="small" x="36" y="416">migration property tests, image with Compose stack and</text>
  <text class="small" x="36" y="432">upgrade test</text>

  <rect class="box fix" x="490" y="356" width="446" height="92" rx="8"/>
  <text class="head" x="502" y="378">Loop: nightly failures first</text>
  <text class="small" x="502" y="400">a failure becomes a PR into main before any other</text>
  <text class="small" x="502" y="416">work; that PR goes through lane 1</text>
  <text class="small" x="502" y="432">a release may hold merges no night has seen yet</text>

  <path class="hot" d="M464,402 H488"/>

  <!-- Lane 3 -->
  <rect class="box rel" x="24" y="508" width="280" height="130" rx="8"/>
  <text class="head" x="36" y="530">Workflow „Release pull request“</text>
  <text class="small" x="36" y="552">the loop starts it when the owner</text>
  <text class="small" x="36" y="568">says so (workflow_dispatch)</text>
  <text class="small" x="36" y="590">changes/* → CHANGELOG.md section</text>
  <text class="small" x="36" y="606">VERSION = next CalVer (26.11.26)</text>
  <text class="small" x="36" y="622">while open: rebuilt after every push</text>

  <rect class="box rel" x="330" y="508" width="310" height="130" rx="8"/>
  <text class="head" x="342" y="530">Release PR „Release 26.11.26“</text>
  <text class="small" x="342" y="552">changes only VERSION, CHANGELOG.md</text>
  <text class="small" x="342" y="568">and changes/ (CI refuses any other file)</text>
  <text class="small" x="342" y="590">changelog check, texts checked again</text>
  <text class="small" x="342" y="606">(Claude + CodeRabbit)</text>
  <text class="small" x="342" y="622">no E2E, no mutation, no image</text>

  <rect class="box rel" x="666" y="508" width="270" height="130" rx="8"/>
  <text class="head" x="678" y="530">Merge = release</text>
  <text class="small" x="678" y="552">the owner merges</text>
  <text class="small" x="678" y="574">push run takes over the results of</text>
  <text class="small" x="678" y="590">the commit before</text>
  <text class="small" x="678" y="612">tag.yml tags the commit with the</text>
  <text class="small" x="678" y="628">version in VERSION</text>

  <path class="flow" d="M304,573 H328"/>
  <path class="flow" d="M640,573 H664"/>

  <!-- Lane 4 -->
  <rect class="box pub" x="24" y="696" width="320" height="68" rx="8"/>
  <text class="head" x="36" y="716">release.yml</text>
  <text class="small" x="36" y="736">image &lt;version&gt; (amd64 + arm64), GitHub release</text>
  <text class="small" x="36" y="752">latest + stable: newest release on main's line [V]</text>

  <rect class="box pub" x="370" y="696" width="250" height="68" rx="8"/>
  <text class="head" x="382" y="716">Operator rolls out</text>
  <text class="small" x="382" y="736">NOVA_VERSION in .env, any release,</text>
  <text class="small" x="382" y="752">skipping some is fine</text>

  <rect class="box pub" x="646" y="696" width="290" height="68" rx="8"/>
  <text class="head" x="658" y="716">Game (issue #81)</text>
  <text class="small" x="658" y="736">„Neuigkeiten“ with every version and date;</text>
  <text class="small" x="658" y="752">update message with the first three entries</text>

  <path class="flow" d="M801,638 V658 H184 V694"/>
  <path class="flow" d="M344,730 H368"/>
  <path class="flow" d="M620,730 H644"/>

  <!-- Hotfix lane -->
  <rect class="box fix" x="24" y="820" width="210" height="70" rx="8"/>
  <text class="head" x="36" y="842">hotfix/&lt;name&gt;</text>
  <text class="small" x="36" y="862">branch from the last release</text>
  <text class="small" x="36" y="878">tag</text>

  <rect class="box fix" x="260" y="820" width="210" height="70" rx="8"/>
  <text class="head" x="272" y="842">Fix PR into hotfix/*</text>
  <text class="small" x="272" y="862">with its fragment,</text>
  <text class="small" x="272" y="878">CI Gate with every check</text>

  <rect class="box fix" x="496" y="820" width="214" height="70" rx="8"/>
  <text class="head" x="508" y="842">Release PR of hotfix/*</text>
  <text class="small" x="508" y="862">metadata only,</text>
  <text class="small" x="508" y="878">merge = tag + image</text>

  <rect class="box fix" x="736" y="820" width="200" height="70" rx="8"/>
  <text class="head" x="748" y="842">Merge back into main</text>
  <text class="small" x="748" y="862">the existing tag is not</text>
  <text class="small" x="748" y="878">set again</text>

  <path class="hot" d="M234,855 H258"/>
  <path class="hot" d="M470,855 H494"/>
  <path class="hot" d="M710,855 H734"/>

  <text class="note" x="14" y="926">Gone: release candidates (-rc.N), draft and „Ready“ of the release PR, label „voller-lauf“, the second complete run per release.  [V] = proposal, not yet decided.</text>
</svg>
