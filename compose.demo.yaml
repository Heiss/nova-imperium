# Local demo and CI: invitation mails land in Mailpit (http://localhost:8025)
# instead of the internet. Set up with `docker/init-env.sh --demo`.
services:
  app:
    depends_on:
      - mailpit

  mailpit:
    image: axllent/mailpit:v1.33
    restart: unless-stopped
    ports:
      - '127.0.0.1:${NOVA_MAIL_PORT:-8025}:8025'
