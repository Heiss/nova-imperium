name: Mutation tests (nightly)

# Complete Stryker run every night on main. It also refreshes the cached result
# that the incremental runs of the pull requests start from.
on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    name: Mutation tests (complete)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v6
        with:
          path: reports/stryker-incremental.json
          key: stryker-${{ github.ref }}-${{ github.sha }}-${{ github.run_id }}
          restore-keys: |
            stryker-${{ github.ref }}-
      - run: pnpm test:mutation --force
