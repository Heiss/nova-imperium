name: Mutation tests (nightly)

# Complete Stryker run every night on main, in 6 shards like the CI (owner,
# 2026-11-12, #131). It also refreshes the cached result of every shard, the
# merged report and the weights of every mutant (#141) that the incremental
# runs of the pull requests start from. "Run workflow" on another branch runs the same complete sharded run
# there: the proof run of #131 (gh workflow run mutation.yml --ref <branch>).
on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation-plan:
    name: Mutation plan
    runs-on: ubuntu-latest
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # TypeScript cuts large files between their top-level statements.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The plan of the last run on this branch, else on main, and the
      # weights of its mutants, updated by every run (#141): every file stays
      # on its shard, so the shard keeps its cached results.
      - name: Plan and weights of the last run
        id: state
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/mutation-state.json
          key: stryker-state-${{ github.ref }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            stryker-state-${{ github.ref }}-
            stryker-state-refs/heads/main-
      # Without a state the weights come from the last complete run: an
      # incremental report reuses old results, whose times did not match the
      # run (#131).
      - name: Merged report of the last complete run (the weights)
        if: steps.state.outputs.cache-matched-key == ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/mutation/mutation.json
          key: stryker-weights-${{ github.ref }}-${{ github.sha }}-${{ github.run_id }}
          restore-keys: |
            stryker-weights-${{ github.ref }}-
            stryker-weights-refs/heads/main-
            stryker-report-${{ github.ref }}-
            stryker-report-refs/heads/main-
      - name: Split the mutated files into 6 shards
        id: plan
        run: |
          plan=$(node scripts/mutation-shards.ts plan)
          echo "plan=$plan" >> "$GITHUB_OUTPUT"
      # The new plan and the weights it used, for the gate job.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-state
          path: reports/mutation-state.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  mutation-shard:
    name: Mutation tests (complete, shard ${{ matrix.shard }} of 6)
    needs: mutation-plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/stryker-incremental.json
          key: stryker-shard${{ matrix.shard }}-${{ github.ref }}-${{ github.sha }}-${{ github.run_id }}
          restore-keys: |
            stryker-shard${{ matrix.shard }}-${{ github.ref }}-
      - name: Configuration of this shard
        env:
          MUTATION_PLAN: ${{ needs.mutation-plan.outputs.plan }}
          SHARD: ${{ matrix.shard }}
        run: node scripts/mutation-shards.ts config "$SHARD"
      - run: pnpm test:mutation reports/stryker-shard.config.json --force
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-shard-${{ matrix.shard }}
          path: reports/mutation/mutation.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  # The same gate as in the CI: total score (80 %) and every file floor on
  # the merged report. The merged report is kept as an artifact, so a run can
  # be compared with an earlier one.
  mutation:
    name: Mutation tests (complete)
    needs: [mutation-plan, mutation-shard]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # the issue for a file below its floor (last step)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mutation-shard-*
          path: reports/shards
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mutation-state
          path: reports
      - name: Merge the shard reports
        id: merge
        env:
          MUTATION_PLAN: ${{ needs.mutation-plan.outputs.plan }}
        run: node scripts/mutation-shards.ts merge reports/mutation/mutation.json reports/shards/*/mutation.json
      # A complete run gives every mutant that ran its time (#141). Kept with
      # the plan that ran for the next plan.
      - name: Weights of this run
        id: weights
        run: node scripts/mutation-shards.ts weights reports/mutation-state.json reports/mutation/mutation.json
      - name: Keep the plan and the weights for the next plan
        if: always() && steps.weights.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/mutation-state.json
          key: stryker-state-${{ github.ref }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Total score and no file below its floor (mutation-standard.json)
        id: gate
        run: node scripts/mutation-gate.ts --report reports/mutation/mutation.json
      - name: Keep the merged report as the weights of the next plans
        if: always() && steps.merge.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/mutation/mutation.json
          key: stryker-weights-${{ github.ref }}-${{ github.sha }}-${{ github.run_id }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.merge.outcome == 'success'
        with:
          name: mutation-report
          path: reports/mutation/mutation.json
          overwrite: true
          retention-days: 30
      # A pull request mutates only the files it changes (#309), so a file
      # it lowers without touching it is found here. The first failure opens
      # one issue and the next nights update it, so the owner sees the files
      # below their floor the next morning (a failed run alone only sends a
      # mail to whoever changed the schedule last). Only the schedule on
      # main; the proof run on another branch opens none. The step runs when
      # the gate failed, not when a shard did.
      - name: Open or update the issue for the files below their floor
        if: always() && steps.gate.outcome == 'failure' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: Mutation floor missed on main
        run: |
          # The gate has failed already: its exit code does not count here.
          node scripts/mutation-gate.ts --report reports/mutation/mutation.json |
            sed -n 's/^::error:://p' | sed 's/^/- /' > failures.txt || true
          [ -s failures.txt ] || echo "- (none named: see the log of the run)" > failures.txt
          {
            printf 'The complete mutation run of main (%s) found a file below its floor in mutation-standard.json, or a total below the break threshold:\n\n' "$RUN"
            cat failures.txt
            printf '\nA pull request mutates only the files it changes, so a drop in a file it did not change is found by this run. Raise the tests of the file, or revert the change that lowered it. Updated every night until the run is green; close this issue when it is.\n'
          } > body.md
          number=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number,title --jq ".[] | select(.title == \"$TITLE\") | .number" | head -n 1)
          if [ -z "$number" ]; then
            gh issue create --title "$TITLE" --body-file body.md
          else
            gh issue edit "$number" --body-file body.md
          fi
