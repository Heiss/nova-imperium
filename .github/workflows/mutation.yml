name: Mutation tests (nightly)

# Complete Stryker run every night on main. It also refreshes the cached result
# that the incremental runs of the pull requests start from.
on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    name: Mutation tests (complete)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: reports/stryker-incremental.json
          key: stryker-${{ github.ref }}-${{ github.sha }}-${{ github.run_id }}
          restore-keys: |
            stryker-${{ github.ref }}-
      - run: pnpm test:mutation --force
      - name: No file below its floor (mutation-standard.json)
        run: node scripts/mutation-gate.ts
