name: Release

# A tag like 26.11.0 (CalVer YY.M.MICRO, no "v") builds and publishes the image
# as 26.11.0; the job "aliases" points latest and stable at the newest
# release (the newest state of main: next-image.yml, „next“),
# but only when CI already passed on main or hotfix/* for the tagged commit.
# Tags come from merged release pull requests (tag.yml); the release notes are
# the German section of CHANGELOG.md.
# "Run workflow" by hand builds the image without publishing (dry run).
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    name: Image
    runs-on: ubuntu-latest
    permissions:
      actions: read # Prior CI runs
      contents: write # GitHub release
      packages: write # GHCR
    outputs:
      image: ${{ steps.v.outputs.image }}
      tag: ${{ steps.v.outputs.tag }}
      # The pushed image by its digest, for the check without AVX (#456).
      digest: ${{ steps.build.outputs.digest }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Version and image name
        id: v
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=ghcr.io/${owner}/nova-imperium" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            tag="$GITHUB_REF_NAME"
            if ! printf '%s' "$tag" | grep -Eq '^[0-9]{2}\.([1-9]|1[0-2])\.(0|[1-9][0-9]*)$'; then
              echo "The tag \"$tag\" is not CalVer YY.M.MICRO (for example 26.11.0)"
              exit 1
            fi
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag=dry-run" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Require successful CI on main or hotfix/* for the tagged commit
        if: steps.v.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          commit=$(git rev-parse 'HEAD^{commit}')
          runs=$(gh api --jq '.total_count' \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=push&head_sha=$commit&status=success&per_page=1")
          if ! printf '%s\n' "$runs" | grep -Eq '^[1-9][0-9]*$'; then
            echo "::error::No successful CI push run for $commit. Release blocked."
            exit 1
          fi

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: steps.v.outputs.publish == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: app
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.v.outputs.publish == 'true' }}
          tags: |
            ${{ steps.v.outputs.image }}:${{ steps.v.outputs.tag }}
          # Debian's security updates are fetched fresh for every release,
          # not taken from the layer cache (Dockerfile, OS_UPDATES).
          build-args: |
            OS_UPDATES=${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.v.outputs.publish == 'true'
        with:
          node-version-file: .node-version
          # No cache in a workflow that publishes or pushes.
          package-manager-cache: false

      # The German section of CHANGELOG.md, then GitHub's list of the pull
      # requests since the previous release.
      - name: GitHub release
        if: steps.v.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          # A re-run of the whole workflow keeps the existing release, so the
          # aliases job still runs.
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "The release $TAG exists already."
            exit 0
          fi
          node scripts/changelog.ts notes "$TAG" > notes.md
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md --generate-notes

  # The freshly built release image is scanned with Trivy, every High and
  # Critical hole with a fix, as the release pull request did before #387
  # (owner, 2026-11-24, 79a). A finding fails this run visibly and stops
  # the aliases below: latest and stable stay on the previous release; the
  # tag and the image <version> stay as they are, and the loop tells the
  # owner. Each published platform is scanned on its own: a hole of the arm64
  # image only must stop the aliases too (CodeRabbit on #395).
  scan:
    name: Trivy of the release image (${{ matrix.platform }})
    needs: image
    if: needs.image.outputs.publish == 'true'
    runs-on: ubuntu-latest
    strategy:
      # Both platforms report their holes; either one stops the aliases.
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    permissions:
      contents: read
      packages: read # GHCR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          # No cache in a workflow that publishes or pushes.
          package-manager-cache: false
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Trivy gate (High and Critical holes with a fix)
        env:
          IMAGE: ${{ needs.image.outputs.image }}
          TAG: ${{ needs.image.outputs.tag }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          # The image of this platform only, read by Trivy from the registry:
          # a pull of the other platform into the daemon of the runner left
          # its export to Trivy without the content (26.11.28, arm64:
          # "content digest ... not found"). The login above wrote the
          # credentials to the docker config, mounted read-only; the token
          # is in no argument and no log.
          docker run --rm -v "$PWD:/out" -v "$HOME/.docker:/docker:ro" -e DOCKER_CONFIG=/docker \
            aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb \
            image --image-src remote --platform "$PLATFORM" --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --format json \
            --output /out/trivy-image.json --no-progress "$IMAGE:$TAG"
          node scripts/trivy-gate.ts trivy-image.json

  # The pushed release image runs on a CPU without AVX (#456; owner,
  # 2026-11-27, #449, 291a): it differs from the image of CI only by the
  # Debian updates of this release (OS_UPDATES), so it gets the same check.
  # Its amd64 image, by digest, starts under QEMU in user mode with the CPU
  # model Denverton (the static QEMU binary of scripts/static-qemu.sh, as compose.noavx.yaml
  # in CI) on a fresh data volume, creates and migrates the database and
  # answers /healthz. A failure stops the aliases below, like the scan.
  noavx:
    name: The release image runs on a CPU without AVX
    needs: image
    if: needs.image.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read # GHCR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: The release image answers /healthz on a CPU without AVX (#456)
        env:
          IMAGE: ${{ needs.image.outputs.image }}
          DIGEST: ${{ needs.image.outputs.digest }}
          # Two seconds apart: a start under QEMU takes a while.
          TRIES: '90'
        run: scripts/release-noavx.sh

  # latest and stable always name the newest release tag: the job looks the
  # newest tag up itself and moves both aliases only when that is the tag
  # this run scanned (79a [V]); the run of an older release leaves them to
  # the newest release's own run. Runs are serialized. A re-run of an older
  # release or a hotfix of an older line never moves them back, nor onto a
  # newer image whose scan failed.
  aliases:
    name: latest and stable
    # Only after the scan of the release image passed (79a) and it ran on a
    # CPU without AVX (#456).
    needs: [image, scan, noavx]
    if: needs.image.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # GHCR
    concurrency:
      group: release-aliases
      cancel-in-progress: false
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Point latest and stable at the newest release
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ needs.image.outputs.image }}
          TAG: ${{ needs.image.outputs.tag }}
        run: |
          newest=$(gh api --paginate "repos/$GITHUB_REPOSITORY/tags?per_page=100" --jq '.[].name' |
            grep -E '^[0-9]{2}\.([1-9]|1[0-2])\.(0|[1-9][0-9]*)$' |
            sort -t. -k1,1n -k2,2n -k3,3n | tail -n 1)
          # Only the image this run scanned (79a [V]): a run of an older
          # release must not move the aliases to a newer image whose own scan
          # failed; the newest release's own run sets them.
          if [ "$newest" != "$TAG" ]; then
            echo "$TAG is not the newest release ($newest); its own run sets the aliases."
            exit 0
          fi
          # Only a missing image skips (the newest release's own run sets the
          # aliases); any other registry error fails, and "Re-run failed
          # jobs" repeats only this job.
          if ! out=$(docker buildx imagetools inspect "$IMAGE:$newest" 2>&1); then
            if printf '%s' "$out" | grep -Eqi 'not found|manifest unknown'; then
              echo "The image $newest is not published yet; its own run sets the aliases."
              exit 0
            fi
            printf '%s\n' "$out"
            echo "::error::Could not read $IMAGE:$newest from the registry."
            exit 1
          fi
          docker buildx imagetools create -t "$IMAGE:latest" -t "$IMAGE:stable" "$IMAGE:$newest"
          echo "latest and stable now point to $newest."
