name: Release

# A tag like 26.11.0 (CalVer YY.M.MICRO, no "v") builds and publishes the image
# as 26.11.0; the job "aliases" points latest and stable at the newest
# release (release candidates: rc-image.yml, „next“),
# but only when CI already passed on main or hotfix/* for the tagged commit.
# Tags come from merged release pull requests (tag.yml); the release notes are
# the German section of CHANGELOG.md.
# "Run workflow" by hand builds the image without publishing (dry run).
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    name: Image
    runs-on: ubuntu-latest
    permissions:
      actions: read # Prior CI runs
      contents: write # GitHub release
      packages: write # GHCR
    outputs:
      image: ${{ steps.v.outputs.image }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Version and image name
        id: v
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=ghcr.io/${owner}/nova-imperium" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            tag="$GITHUB_REF_NAME"
            if ! printf '%s' "$tag" | grep -Eq '^[0-9]{2}\.([1-9]|1[0-2])\.(0|[1-9][0-9]*)$'; then
              echo "The tag \"$tag\" is not CalVer YY.M.MICRO (for example 26.11.0)"
              exit 1
            fi
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag=dry-run" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Require successful CI on main or hotfix/* for the tagged commit
        if: steps.v.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          commit=$(git rev-parse 'HEAD^{commit}')
          runs=$(gh api --jq '.total_count' \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=push&head_sha=$commit&status=success&per_page=1")
          if ! printf '%s\n' "$runs" | grep -Eq '^[1-9][0-9]*$'; then
            echo "::error::No successful CI push run for $commit. Release blocked."
            exit 1
          fi

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        if: steps.v.outputs.publish == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: app
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.v.outputs.publish == 'true' }}
          tags: |
            ${{ steps.v.outputs.image }}:${{ steps.v.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: steps.v.outputs.publish == 'true'
        with:
          node-version-file: .node-version
          # No cache in a workflow that publishes or pushes.
          package-manager-cache: false

      # The German section of CHANGELOG.md, then GitHub's list of the pull
      # requests since the previous release.
      - name: GitHub release
        if: steps.v.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          node scripts/changelog.ts notes "$TAG" > notes.md
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md --generate-notes

  # latest and stable always name the newest release tag, whichever release
  # run gets here and in whatever order: the job looks the newest tag up
  # itself and points both aliases at its image. Runs are serialized; a run
  # waiting here may be replaced by a later one, which sets the same result.
  # A re-run of an older release or a hotfix of an older line never moves
  # them back.
  aliases:
    name: latest and stable
    needs: image
    if: needs.image.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # GHCR
    concurrency:
      group: release-aliases
      cancel-in-progress: false
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Point latest and stable at the newest release
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ needs.image.outputs.image }}
        run: |
          newest=$(gh api --paginate "repos/$GITHUB_REPOSITORY/tags?per_page=100" --jq '.[].name' |
            grep -E '^[0-9]{2}\.([1-9]|1[0-2])\.(0|[1-9][0-9]*)$' |
            sort -t. -k1,1n -k2,2n -k3,3n | tail -n 1)
          if ! docker buildx imagetools inspect "$IMAGE:$newest" > /dev/null 2>&1; then
            echo "The image $newest is not published yet; its own run sets the aliases."
            exit 0
          fi
          docker buildx imagetools create -t "$IMAGE:latest" -t "$IMAGE:stable" "$IMAGE:$newest"
          echo "latest and stable now point to $newest."
