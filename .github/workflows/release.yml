name: Release

# A tag like 26.11.0 (CalVer YY.M.MICRO, no "v") builds and publishes the image,
# but only after the whole CI suite passed again on the tagged commit.
# "Run workflow" by hand builds the image without publishing (dry run).
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: CI on the tagged commit
    uses: ./.github/workflows/ci.yml
    # A called workflow gets no more rights than this: CodeQL uploads its
    # results to code scanning and needs security-events.
    permissions:
      contents: read
      security-events: write

  image:
    name: Image
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitHub release
      packages: write # GHCR
    steps:
      - uses: actions/checkout@v7

      - name: Version and image name
        id: v
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=ghcr.io/${owner}/nova-imperium" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
            if ! printf '%s' "$tag" | grep -Eq '^[0-9]{2}\.([1-9]|1[0-2])\.(0|[1-9][0-9]*)$'; then
              echo "The tag \"$tag\" is not CalVer YY.M.MICRO (for example 26.11.0)"
              exit 1
            fi
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag=dry-run" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: steps.v.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: app
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.v.outputs.publish == 'true' }}
          tags: |
            ${{ steps.v.outputs.image }}:${{ steps.v.outputs.tag }}
            ${{ steps.v.outputs.publish == 'true' && format('{0}:latest', steps.v.outputs.image) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: GitHub release
        if: steps.v.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.v.outputs.tag }}
        run: gh release create "$TAG" --title "$TAG" --generate-notes
