name: Migration upgrade tests (nightly)

# The property-based upgrade tests of every migration with a random seed and
# 1000 generated databases each. Pull requests run 100 with a fixed seed. A
# failure prints the seed; reproduce it locally with
#   MIGRATION_SEED=<seed> pnpm test src/server/db/migrations.property.test.ts
on:
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upgrade:
    name: Migration upgrade tests (random seed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # pnpm test writes the feature index first (scripts/gen-features.ts).
      - run: pnpm test src/server/db/migrations.property.test.ts
        env:
          MIGRATION_SEED: random
          MIGRATION_RUNS: '1000'
