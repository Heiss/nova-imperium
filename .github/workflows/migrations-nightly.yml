name: Migration upgrade tests (nightly)

# The property-based upgrade tests of every migration with a random seed and
# 1000 generated databases each. Pull requests run 100 with a fixed seed. A
# failure prints the seed; reproduce it locally with
#   MIGRATION_SEED=<seed> pnpm vitest run src/server/db/migrations.property.test.ts
on:
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upgrade:
    name: Migration upgrade tests (random seed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run src/server/db/migrations.property.test.ts
        env:
          MIGRATION_SEED: random
          MIGRATION_RUNS: '1000'
