name: CI

# Every push to main or hotfix/* runs the full suite, except an expensive job
# that already succeeded on the identical tree: when the pushed commit merged
# one pull request whose tested head has the same Git tree, each of the checks,
# the E2E tests, the complete mutation run, the image with the Compose stack
# and the website is skipped when the same job succeeded in a green CI run of
# that head, the mutation run when its own mutation jobs, complete or for the
# changed files, succeeded there (scripts/already-tested.ts, owner,
# 2026-11-21, #342); every other
# case and every error of the lookup runs everything, and the CI Gate names
# the run and the job of each proof. Pull requests run what their changes
# need: documentation only skips the code checks; the Docker
# image, Trivy and the Compose stack with the upgrade test run when the image
# can change (owner, 2026-11-12); a release pull request runs none (#387). The
# mutation tests run when a pull request changes what Stryker mutates, a test,
# the mutation configuration or the test tool chain (#146), and take over the
# green result of the previous head when the newest head only merged main
# (#167). A pull request that goes into no hotfix branch mutates only the
# files it changes and the sources of the tests it changes, at any size, in
# parts of about 12 files split by the weights of the last complete run
# (#309; owner, 2026-11-26, #370, 189a and 190a); a change of the floors
# alone in mutation-floors.txt adds those files to the partial run. The
# complete run in 12 shards comes from the nightly run of mutation.yml on
# main; it runs in a pull request only for a change of the mutation
# configuration or the test tool chain, into a hotfix branch, and while the
# last nightly complete run on main is red or missing (a pull request whose
# partial set is not empty then runs it, until a nightly run is green again;
# #370, 194a via 197b and 201a; scripts/mutation-nightly.ts, the gate prints
# the run it looked at). A push to main runs no mutation job: the result of
# the pull request counts, and without a proof the nightly run tests the
# tree (#370, 195a and 200a; output "nightly"). A push to hotfix/** runs the
# complete run unless proven (#342).
# A release pull request (head release/*, of main or of a hotfix branch)
# changes only VERSION, CHANGELOG.md and changes/: "Detect changes" refuses
# any other file, and it runs no expensive job; it relies on the results of
# its base (owner, 2026-11-23 and 2026-11-24, #387).
# The documentation website is built when its sources change (#144).
# A pull request into main whose head lacks the base of its event fails in
# "Detect changes" before any expensive job (#431).
# Only the gate job "CI Gate" is the required check of main.
on:
  pull_request:
    # labeled/unlabeled: the label "kein-changelog" changes the fragment
    # check.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main, 'hotfix/**']
  # The complete run every night on main (owner, 2026-11-23 and 2026-11-24,
  # #387 part 3): the unit suite, the E2E suite and the image with the
  # Compose stack and the upgrade test; the complete mutation run is
  # mutation.yml and the migration property tests migrations-nightly.yml
  # that same night, so this run skips the mutation jobs. The release loop
  # looks at these runs first and fixes a failure through a pull request
  # into main before any other work.
  schedule:
    - cron: '7 1 * * *'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'push' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Only pull requests use changed files to decide which checks to run; a
  # push looks for the proofs of the identical tree (#342).
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    # checks: read for the check runs of the previous head (#167); actions
    # and pull-requests: read for the pull request and the run of a push
    # (#342). Read only.
    permissions:
      contents: read
      checks: read
      actions: read
      pull-requests: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
      image: ${{ steps.diff.outputs.image }}
      mutation: ${{ steps.diff.outputs.mutation }}
      mutation-files: ${{ steps.diff.outputs.mutation-files }}
      mutation-plan: ${{ steps.diff.outputs.mutation-plan }}
      mutation-parts: ${{ steps.diff.outputs.mutation-parts }}
      mutation-nightly: ${{ steps.diff.outputs.mutation-nightly }}
      site: ${{ steps.diff.outputs.site }}
      proof-check: ${{ steps.proof.outputs.proof-check }}
      proof-e2e: ${{ steps.proof.outputs.proof-e2e }}
      proof-mutation: ${{ steps.proof.outputs.proof-mutation }}
      proof-compose: ${{ steps.proof.outputs.proof-compose }}
      proof-site: ${{ steps.proof.outputs.proof-site }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
          persist-credentials: false
      # A release head, on every push to it (synchronize too), is refused by
      # the CI Gate itself while another release branch or a tag holds its
      # version or, for main, a released hotfix is not merged back: the same
      # checks as release-pr.sh, which only keeps the pull request a draft
      # (CodeRabbit on #395). The checkout above has every branch and tag.
      - name: The release head is releasable
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/')
        env:
          BASE: ${{ github.base_ref }}
        run: sh scripts/release-pr.sh check
      # A push checks out its own commit of main or the hotfix branch, the
      # scripts only; nothing of a pull request. The nightly run needs it
      # too, for .node-version (CodeRabbit on #395).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'push' || github.event_name == 'schedule'
        with:
          persist-credentials: false
          sparse-checkout: scripts
      # scripts/mutation-changes.ts and scripts/already-tested.ts need Node
      # only, no dependencies.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      # The proofs of a push: the jobs that succeeded in the green CI run of
      # the pull request it merged, on the identical tree (#342). The script
      # proves nothing on any error; a failure of the step itself proves
      # nothing either, and only the five proof lines reach the outputs.
      - id: proof
        if: github.event_name == 'push'
        env:
          HEAD_SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if proofs=$(node scripts/already-tested.ts decide "$HEAD_SHA" "$BRANCH"); then
            grep -E '^proof-(check|e2e|mutation|compose|site)=' <<< "$proofs" >> "$GITHUB_OUTPUT" || true
          else
            echo "::warning::No lookup of an earlier run: this push runs everything."
          fi
      # The weights of the last complete run on main, read only, to split the
      # partial run into parts (#370, 190a). Nothing is saved here: a partial
      # result never reaches a plan or a weight. Without it the parts are
      # weighed by their lines.
      - name: Weights of the last complete run on main (read only)
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/mutation-state.json
          key: stryker-state-refs/heads/main-${{ github.sha }}-parts
          restore-keys: |
            stryker-state-refs/heads/main-
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_REF: ${{ github.head_ref }}
          PR_BASE_REF: ${{ github.base_ref }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # The nightly run: everything but the mutation jobs, which
          # mutation.yml runs complete the same night (#387).
          if [ "$EVENT" = "schedule" ]; then
            {
              echo "code=true"
              echo "image=true"
              echo "mutation=false"
              echo "site=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A push to main runs no mutation job: the result of the pull
          # request counts (identical tree, #342), and without a proof the
          # next nightly complete run tests main as it is that night (owner, 2026-11-26, #370,
          # 195a and 200a; output "nightly"). A push to hotfix/** runs the
          # complete run unless proven.
          if [ "$EVENT" = "push" ] || [ -z "$PR_BASE" ]; then
            mutation=true
            if [ "$EVENT" = "push" ] && [ "$BRANCH" = main ]; then mutation=nightly; fi
            {
              echo "code=true"
              echo "image=true"
              echo "mutation=$mutation"
              echo "site=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A pull request into main whose head does not contain the base of
          # its event fails here, before any expensive job (owner, 2026-11-27,
          # #431, 203b and 205a): the strict ruleset of main needs an
          # up-to-date branch, so such a head would run again after the
          # update. Head and base are commits of the event, not the merge
          # commit; the checkout has the whole history, and an error of the
          # check fails it too. Pull requests into hotfix/** and release
          # pull requests keep their own rules.
          case "$PR_BASE_REF:$PR_HEAD_REF" in
            main:release/*) ;;
            main:*)
              status=0
              git merge-base --is-ancestor "$PR_BASE" "$PR_HEAD" || status=$?
              case "$status" in
                0) ;;
                1)
                  echo "::error::The head $PR_HEAD does not contain the current main $PR_BASE. Run: git fetch origin && git merge origin/main, then push (#431)."
                  exit 1
                  ;;
                *)
                  echo "::error::Cannot check whether the head $PR_HEAD contains main $PR_BASE (git exit $status); run the job again (#431)."
                  exit 1
                  ;;
              esac
              ;;
          esac
          files=$(git diff --name-only --no-renames "$PR_BASE" "$HEAD_SHA")
          # A release pull request (of main or of a hotfix branch) changes
          # only the metadata files and runs no expensive job; any other
          # file fails it (owner, 2026-11-23 and 2026-11-24, #387).
          case "$PR_HEAD_REF" in
            release/*)
              other=$(grep -Ev '^(VERSION|CHANGELOG\.md|changes/.*)$' <<< "$files" || true)
              if [ -n "$other" ]; then
                echo "::error::A release pull request changes only VERSION, CHANGELOG.md and changes/, not: $(tr '\n' ' ' <<< "$other")"
                exit 1
              fi
              echo "Release pull request: metadata only, no expensive job (#387)."
              {
                echo "code=false"
                echo "image=false"
                echo "mutation=false"
                echo "site=false"
              } >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          code=false
          image=false
          site=false
          # Every pull request into a hotfix branch runs everything: it leads
          # straight to a release.
          case "$PR_BASE_REF" in hotfix/*) code=true; image=true; site=true ;; esac
          while IFS= read -r file; do
            # The website (website/) is documentation: it has its own job.
            case "$file" in
              okf/*|docs/*|changes/*|website/*) ;;
              */*) code=true ;;
              *.md) ;;
              *) code=true ;;
            esac
            # What can change the image, its start, the stack or the upgrade.
            case "$file" in
              Dockerfile|.dockerignore|compose*.yaml|docker/*|package.json|pnpm-lock.yaml|pnpm-workspace.yaml|.node-version|scripts/gen-features.ts) image=true ;;
              src/server/db/*|src/server/main.ts|src/server/server.ts|src/server/config.ts|src/server/cli.ts|src/server/maintenance.ts) image=true ;;
              .github/workflows/ci.yml) image=true ;;
            esac
            # What the documentation website is built from (okf/ops/website.md);
            # scripts/okf-log.ts reads and checks the update log (#212).
            case "$file" in
              okf/*|docs/*|website/*|scripts/okf-log.ts|.github/workflows/ci.yml|.github/workflows/pages.yml) site=true ;;
            esac
          done <<< "$files"
          # The mutation jobs run when the changes touch a file of the mutate
          # globs of stryker.config.json, a test file, the mutation
          # configuration or the versions of Stryker, Vitest or TypeScript in
          # the lockfile (scripts/mutation-changes.ts, owner, 2026-11-13,
          # #146). A release pull request ran no mutation job above (#387).
          # Every other pull request, one into a hotfix branch excepted, runs
          # them for the changed files only, at any size (output "partial",
          # scripts/mutation-partial.ts, owner, 2026-11-18, #309, and
          # 2026-11-26, #370, 189a): the files of the mutate globs it changes
          # and the source of each test file it changes, plus every file whose
          # floor in mutation-floors.txt it adds, changes or removes, split
          # into parts of about 12 files by the weights of the last complete
          # run (190a). A change of the mutation configuration
          # (stryker.config.json, vitest.config.ts, tsconfig.json,
          # scripts/mutation-*.ts, mutation-standard.json) or of the test tool
          # chain still runs everything ("true"); no such file means no
          # mutation job ("false"). While the last nightly complete run on
          # main (mutation.yml) is red or missing, a pull request into main
          # that would run the partial run runs the complete run instead,
          # until a nightly run is green again (194a via 197b,
          # scripts/mutation-nightly.ts; every error of the lookup counts as
          # missing).
          mutation_files=
          mutation_plan=
          mutation_parts=
          mutation_nightly=
          case "$PR_BASE_REF" in
            hotfix/*) mutation=$(node scripts/mutation-changes.ts "$PR_BASE" "$HEAD_SHA") ;;
            *)
              partial=$(node scripts/mutation-partial.ts plan "$PR_BASE" "$HEAD_SHA")
              case "$partial" in
                true) mutation=true ;;
                '[]') mutation=false ;;
                *) mutation=partial; mutation_files=$partial ;;
              esac
              ;;
          esac
          if [ "$mutation" = partial ] && [ "$PR_BASE_REF" = main ]; then
            nightly=$(node scripts/mutation-nightly.ts check)
            mutation_nightly=$(sed -n 2p <<< "$nightly")
            if [ "$(sed -n 1p <<< "$nightly")" != green ]; then
              mutation=true
              mutation_files=
            fi
          fi
          if [ "$mutation" = partial ]; then
            mutation_plan=$(MUTATION_FILES="$mutation_files" node scripts/mutation-partial.ts parts)
            mutation_parts=$(MUTATION_PLAN="$mutation_plan" node scripts/mutation-shards.ts numbers)
          fi
          # A pull request into main whose newest head only merged main takes
          # over the green mutation result of the head before (output
          # "reuse", scripts/mutation-reuse.ts, owner, 2026-11-13, #167).
          # $HEAD_SHA is the merge commit the CI tests, $PR_HEAD the head
          # commit of the branch, on which the check runs are.
          if [ "$mutation" = true ] && [ "$PR_BASE_REF" = main ]; then
            mutation=$(node scripts/mutation-reuse.ts decide "$PR_BASE" "$HEAD_SHA" "$PR_HEAD")
          fi
          {
            echo "code=$code"
            echo "image=$image"
            echo "mutation=$mutation"
            echo "mutation-files=$mutation_files"
            echo "mutation-plan=$mutation_plan"
            echo "mutation-parts=$mutation_parts"
            echo "mutation-nightly=$mutation_nightly"
            echo "site=$site"
          } >> "$GITHUB_OUTPUT"
          # The push after the merge reads this note: "false" (nothing to
          # mutate) proves its mutation jobs, any other value does not
          # (scripts/already-tested.ts, #342).
          echo "::notice title=Mutation jobs::$mutation"

  # Every pull request that changes the game brings a German changelog
  # fragment in changes/, or carries the label "kein-changelog"; all
  # fragments must be well-formed (scripts/changelog.ts).
  fragments:
    name: Changelog fragments
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: A fragment for game changes, every fragment well-formed
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: node scripts/changelog.ts check "$PR_BASE"

  check:
    name: Lint, types, unit tests with coverage, build
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.proof-check == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Two commits: HEAD^1, the base of the size ratchet below.
          fetch-depth: 2
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint --max-warnings 0
      # Dead code, copied code and import rules (knip, jscpd, dependency-cruiser).
      - run: pnpm lint:dead
      - run: pnpm lint:dupes
      - run: pnpm lint:deps
      # src/client/main.ts must not have more lines than on its base
      # (scripts/size-ratchet.ts, #242, #317): HEAD^1 is main for the merge
      # commit of a pull request, and the commit before for a push. No file
      # holds the limit, so no pull request edits one for it.
      - run: pnpm lint:size HEAD^1
      - run: pnpm format:check
      - run: pnpm typecheck
      # Blocks below 90 % lines and 85 % branches (vitest.config.ts).
      - run: pnpm test:coverage
      - run: pnpm build

  # The E2E suite in several jobs (#372; owner, 2026-11-23, #387): each
  # part starts its own servers with their own data and runs its share of
  # the spec files (scripts/e2e-shards.ts, e2e/shards.json, planned by the
  # measured time of every file; a new spec runs in the part its name hashes
  # to). Together the parts are the suite; the job „E2E tests (browser)“
  # below needs all of them, so the CI Gate and the proofs of a push (#342)
  # see one job as before.
  e2e-part:
    name: E2E tests (part ${{ matrix.part }})
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.proof-e2e == ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - name: The spec files of this part
        env:
          PART: ${{ matrix.part }}
        run: |
          mapfile -t files < <(node scripts/e2e-shards.ts files "$PART")
          [ "${#files[@]}" -gt 0 ] || { echo "::error::Part $PART has no spec file."; exit 1; }
          printf '%s\n' "${files[@]}"
          pnpm test:e2e "${files[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report-part-${{ matrix.part }}
          path: playwright-report
          retention-days: 7

  e2e:
    name: E2E tests (browser)
    needs: [changes, e2e-part]
    if: always() && needs.changes.outputs.code == 'true' && needs.changes.outputs.proof-e2e == ''
    runs-on: ubuntu-latest
    steps:
      - name: Every part succeeded
        env:
          PARTS: ${{ needs.e2e-part.result }}
        run: |
          if [ "$PARTS" != "success" ]; then
            echo "::error::A part of the E2E suite did not succeed (result: $PARTS); its report is the artifact playwright-report-part-<N>."
            exit 1
          fi

  # Mutation tests in 12 parallel shards (SHARDS in scripts/mutation-shards.ts,
  # 6 until 2026-11-20; owner, 2026-11-12, 2026-11-13 and 2026-11-20,
  # #131). The plan splits the files Stryker mutates once for all shards, by
  # the test time of their mutants in the weights of the last run, else in
  # the last complete run, else in the last merged report, else by their
  # lines; a file without a weight costs as much as the mean file with one;
  # every file stays on the shard of the last plan unless a shard is above
  # 1.5 times the mean (#141, scripts/mutation-shards.ts). A pull
  # request runs them only when it changes what they test (output mutation,
  # #146), and skips them when it takes over the result of the head before
  # (#167); a push to main or hotfix/** always runs them. They run in a pull
  # request only when the output is "true": a change of the mutation
  # configuration or the test tool chain, a pull request into a hotfix
  # branch; every other pull request that changes
  # something they test runs "Mutation tests (changed files)" below (#309).
  mutation-plan:
    name: Mutation plan
    needs: changes
    if: needs.changes.outputs.mutation == 'true' && needs.changes.outputs.proof-mutation == ''
    runs-on: ubuntu-latest
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # TypeScript cuts large files between their top-level statements.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The plan of the last run on this branch, else on main, and the
      # weights of its mutants, updated by every run (#141): every file stays
      # on its shard, so the shard keeps its cached results.
      - name: Plan and weights of the last run
        id: state
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/mutation-state.json
          key: stryker-state-${{ github.ref }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            stryker-state-${{ github.ref }}-
            stryker-state-refs/heads/main-
      # Without a state the weights come from the last complete run (the
      # nightly run): an incremental report reuses old results,
      # whose times did not match the run (#131). Without one, the last
      # merged report.
      - name: Merged report of the last complete run (the weights)
        if: steps.state.outputs.cache-matched-key == ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/mutation/mutation.json
          key: stryker-weights-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            stryker-weights-${{ github.ref }}-
            stryker-weights-refs/heads/main-
            stryker-report-${{ github.ref }}-
            stryker-report-refs/heads/main-
      # The number of shards is SHARDS in scripts/mutation-shards.ts; the
      # matrix of the shard jobs is the list of their numbers (#141, 2026-11-20).
      - name: Split the mutated files into shards
        id: plan
        run: |
          plan=$(node scripts/mutation-shards.ts plan)
          echo "plan=$plan" >> "$GITHUB_OUTPUT"
          shards=$(MUTATION_PLAN="$plan" node scripts/mutation-shards.ts numbers)
          echo "shards=$shards" >> "$GITHUB_OUTPUT"
      # The new plan and the weights it used, for the gate job.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-state
          path: reports/mutation-state.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  # Each shard keeps its own incremental result: unchanged code keeps its
  # cached result on pull requests and on main, except the static mutants,
  # which always run again (#201). The nightly run (mutation.yml) tests
  # every mutant. A shard runs without
  # Stryker's break threshold; the gate below checks the merged report.
  mutation-shard:
    name: Mutation tests (shard ${{ matrix.shard }} of ${{ strategy.job-total }})
    needs: [changes, mutation-plan]
    if: needs.changes.outputs.mutation == 'true' && needs.changes.outputs.proof-mutation == ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Empty when the plan job is skipped (the jobs are skipped too); the
        # fallback only keeps the expression valid.
        shard: ${{ fromJSON(needs.mutation-plan.outputs.shards || '[1]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Result of the last run of this shard
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/stryker-incremental.json
          key: stryker-shard${{ matrix.shard }}-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            stryker-shard${{ matrix.shard }}-${{ github.ref }}-
            stryker-shard${{ matrix.shard }}-refs/heads/main-
      - name: Configuration of this shard
        env:
          MUTATION_PLAN: ${{ needs.mutation-plan.outputs.plan }}
          SHARD: ${{ matrix.shard }}
        run: node scripts/mutation-shards.ts config "$SHARD"
      # A static mutant (code run when its module loads, so every test runs
      # against it) never gets an added covering test, and Stryker takes
      # over its old result even when a new test kills it now. So static
      # mutants always run again; every other result stays (owner,
      # 2026-11-14, #201).
      - name: Static mutants run again
        run: node scripts/mutation-shards.ts drop-static
      - name: Incremental run
        run: pnpm test:mutation reports/stryker-shard.config.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-shard-${{ matrix.shard }}
          path: reports/mutation/mutation.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  # Merges the shard reports (every shard once, with exactly its files)
  # and checks them as one run: a total mutation score below 80 % fails
  # (break threshold of stryker.config.json), a file below its floor fails
  # too (mutation-floors.txt, mutation-standard.json).
  mutation:
    name: Mutation tests
    needs: [changes, mutation-plan, mutation-shard]
    if: needs.changes.outputs.mutation == 'true' && needs.changes.outputs.proof-mutation == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mutation-shard-*
          path: reports/shards
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mutation-state
          path: reports
      - name: Merge the shard reports
        id: merge
        env:
          MUTATION_PLAN: ${{ needs.mutation-plan.outputs.plan }}
        run: node scripts/mutation-shards.ts merge reports/mutation/mutation.json reports/shards/*/mutation.json
      # The times of the mutants this run ran; the others keep their old
      # time (#141). Kept with the plan that ran for the next plan.
      - name: Weights of this run
        id: weights
        run: node scripts/mutation-shards.ts weights reports/mutation-state.json reports/mutation/mutation.json
      - name: Keep the plan and the weights for the next plan
        if: always() && steps.weights.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/mutation-state.json
          key: stryker-state-${{ github.ref }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Total score and no file below its floor (mutation-floors.txt)
        run: node scripts/mutation-gate.ts --report reports/mutation/mutation.json
      - name: Keep the merged report for the next plan
        if: always() && steps.merge.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/mutation/mutation.json
          key: stryker-report-${{ github.ref }}-${{ github.sha }}
      # The complete run is where the floors come from (#304): `gh run
      # download <run-id> -n mutation-report`, then
      # `node scripts/mutation-floors.ts <report>` (okf/ops/testing.md).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.merge.outcome == 'success'
        with:
          name: mutation-report
          path: reports/mutation/mutation.json
          overwrite: true
          retention-days: 30

  # The mutation tests of a pull request for the files it changes (owner,
  # 2026-11-18, #309; output mutation "partial"): the changed files of the
  # mutate globs and the source of each changed test file, listed by
  # scripts/mutation-partial.ts, at any size (2026-11-26, #370, 189a), in
  # parts of about 12 files that "Detect changes" split by the weights of
  # the last complete run (190a; output mutation-plan, the matrix in
  # mutation-parts). Every mutant of those files runs: the jobs read and
  # write none of the caches of the complete runs (stryker-shard*,
  # stryker-state-*, stryker-report-*, stryker-weights-*), so a partial
  # result never reaches the plans, the weights or the cached results of
  # the shards. The job "Mutation tests (changed files)" merges the reports
  # of the parts (each part ran once with exactly its files) and checks
  # every file of the run against its floor and no total score
  # (scripts/mutation-gate.ts --partial). What the pull request does not
  # change is tested by the nightly complete run.
  mutation-partial-part:
    name: Mutation tests (changed files, part ${{ matrix.part }} of ${{ strategy.job-total }})
    needs: changes
    if: needs.changes.outputs.mutation == 'partial'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Empty when the job is skipped; the fallback only keeps the
        # expression valid.
        part: ${{ fromJSON(needs.changes.outputs.mutation-parts || '[1]') }}
    env:
      MUTATION_PLAN: ${{ needs.changes.outputs.mutation-plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Configuration of this part
        env:
          PART: ${{ matrix.part }}
        run: node scripts/mutation-partial.ts config "$PART"
      - run: pnpm test:mutation reports/stryker-partial.config.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-partial-part-${{ matrix.part }}
          path: reports/mutation/mutation.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  mutation-partial:
    name: Mutation tests (changed files)
    needs: [changes, mutation-partial-part]
    if: needs.changes.outputs.mutation == 'partial'
    runs-on: ubuntu-latest
    env:
      MUTATION_FILES: ${{ needs.changes.outputs.mutation-files }}
      MUTATION_PLAN: ${{ needs.changes.outputs.mutation-plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mutation-partial-part-*
          path: reports/parts
      - name: Merge the reports of the parts
        run: node scripts/mutation-partial.ts merge reports/mutation/mutation.json reports/parts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutation-partial-report
          path: reports/mutation/mutation.json
          if-no-files-found: ignore
          overwrite: true
          retention-days: 7
      - name: Every changed file at or above its floor (mutation-floors.txt)
        run: node scripts/mutation-gate.ts --partial

  compose:
    name: Docker image and Compose stack
    needs: changes
    if: needs.changes.outputs.image == 'true' && needs.changes.outputs.proof-compose == ''
    runs-on: ubuntu-latest
    env:
      NOVA_VERSION: ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The Trivy gate builds the image of the base branch too.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: The production setup is valid, and a missing value is named
        run: |
          mkdir -p secrets && : > secrets/smtp_password
          NOVA_PUBLIC_URL=https://game.example.org docker compose --env-file /dev/null -f compose.yaml config -q
          if docker compose --env-file /dev/null -f compose.yaml config -q 2> missing.txt; then
            echo 'compose.yaml must require NOVA_PUBLIC_URL'; exit 1
          fi
          grep NOVA_PUBLIC_URL missing.txt
          rm secrets/smtp_password
      # The demo: Mailpit as the mail sink, COMPOSE_FILE with compose.demo.yaml.
      - run: docker/init-env.sh --demo
      - name: Make the demo secret readable by the container user
        run: sudo chown 1000:1000 secrets/smtp_password
      # Upgrade as on the server (owner, 2026-11-11): the last release writes
      # data, then the new image starts on the same volume.
      - name: Start the last release and write data
        env:
          NOVA_VERSION: latest
        run: |
          docker compose pull app
          docker compose up --detach --no-build --wait
          docker/upgrade.sh before
      - name: Build the application image from the Dockerfile
        run: docker compose build app
      - name: Start the stack with the image built above
        run: docker compose up --detach --no-build --wait
      - name: Data of the last release survive the upgrade
        run: docker/upgrade.sh after
      # Trivy gate (owner, 2026-11-12), holes with a fix only. What goes out
      # as a release from a hotfix branch (a pull request into or a push to
      # hotfix/**) blocks on every High and Critical hole; a release pull
      # request builds no image since #387: release.yml scans the release
      # image before the aliases move (79a). Every other
      # run blocks on Critical; a pull request only on the Critical holes
      # it brings in: the image of its base branch is scanned too, so two
      # Renovate pull requests that each fix one of two holes do not block
      # each other (scripts/trivy-gate.ts).
      - name: Trivy gate mode
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          REF: ${{ github.ref }}
        run: |
          severity=CRITICAL
          mode=new
          [ "$EVENT" = pull_request ] || mode=all
          case "$BASE_REF" in hotfix/*) severity=HIGH,CRITICAL; mode=all ;; esac
          case "$REF" in refs/heads/hotfix/*) severity=HIGH,CRITICAL; mode=all ;; esac
          echo "severity=$severity" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Blocking: $severity, $([ "$mode" = new ] && echo 'only holes this pull request brings in' || echo 'every hole')"
      - name: Build the image of the base branch
        if: steps.gate.outputs.mode == 'new'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git worktree add --detach ../base "$BASE_SHA"
          docker build --target app --tag nova-base:ci ../base
      - name: Trivy gate (holes with a fix only)
        env:
          SEVERITY: ${{ steps.gate.outputs.severity }}
          MODE: ${{ steps.gate.outputs.mode }}
        run: |
          scan() {
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/out" \
              aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb \
              image --scanners vuln --severity "$SEVERITY" --ignore-unfixed --format json \
              --output "/out/$2" --no-progress "$1"
          }
          scan "ghcr.io/heiss/nova-imperium:$NOVA_VERSION" trivy-image.json
          if [ "$MODE" = new ]; then
            scan nova-base:ci trivy-base.json
            node scripts/trivy-gate.ts trivy-image.json trivy-base.json
          else
            node scripts/trivy-gate.ts trivy-image.json
          fi
      - name: The image holds no compiler, package manager or tests
        run: |
          docker compose exec -T app sh -c '! command -v npm && ! command -v pnpm && ! command -v gcc && [ -z "$(find /app/src -name "*.test.ts")" ]'
      - name: A wrong setting stops the start with a message
        run: |
          if docker compose run --rm --no-deps -e NOVA_SESSION_DAYS=0 app > wrong.txt 2>&1; then
            echo 'the server must refuse NOVA_SESSION_DAYS=0'; exit 1
          fi
          grep 'NOVA_SESSION_DAYS' wrong.txt
      - name: Smoke test (headers, invitation mail, registration, data after a restart)
        run: docker/smoke.sh
      # The server has no CPU with AVX (owner, 2026-11-27, #449, 291a): the
      # app starts again on an emulated CPU without AVX (compose.noavx.yaml,
      # QEMU user mode, CPU model Denverton) on the same data, and the same
      # smoke test runs against it. A package or binary that needs AVX stops
      # the process with "Illegal instruction", so the stack never gets
      # healthy and the step fails. The check of PID 1 proves that the app
      # really runs under QEMU.
      - name: The app runs on a CPU without AVX (#449)
        env:
          COMPOSE_FILE: compose.yaml:compose.demo.yaml:compose.noavx.yaml
        run: |
          sudo apt-get update -q || true
          sudo apt-get install -y -q --no-install-recommends qemu-user-static
          docker compose up --detach --no-build --wait
          docker compose exec -T app sh -c 'tr "\0" " " < /proc/1/cmdline' | grep -q 'qemu-x86_64-static -cpu Denverton'
          docker/smoke.sh
      - name: Logs
        if: failure()
        run: docker compose logs --no-color --tail 60
      - name: Remove the Compose stack
        if: always()
        run: docker compose down --volumes

  # Secrets in the history (of a pull request its own commits, 143a) and
  # known holes in the production dependencies. Runs for every change,
  # documentation included.
  security:
    name: Secrets and dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # A pull request scans its own commits only, so a branch of someone else
      # among the fetched refs fails no other pull request; a push and the
      # nightly run scan the whole history of all refs (owner, 2026-11-25,
      # 143a). The range comes from the event as data, never as code.
      # The log names a finding by its rule, file, line and commit only, never
      # its line (owner, 2026-11-26, 153a): gitleaks writes a JSON report
      # into a directory of the runner, jq prints those four fields, and the
      # report is deleted, not uploaded. The step fails with gitleaks, on a
      # finding, and without a readable report. The fields are printed as
      # JSON strings, so a file name cannot start a line of its own (a
      # workflow command).
      - name: No secrets in the history (gitleaks, exceptions in .gitleaksignore)
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          range=
          if [ "$EVENT" = pull_request ]; then range="$BASE_SHA..$HEAD_SHA"; fi
          out="$RUNNER_TEMP/gitleaks"
          rm -rf "$out" && mkdir -p "$out"
          trap 'rm -rf "$out"' EXIT
          status=0
          docker run --rm -v "$PWD:/repo" -v "$out:/out" -e RANGE="$range" --entrypoint sh zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f -c \
            'git config --global --add safe.directory /repo && cd /repo && if [ -n "$RANGE" ]; then gitleaks git . --log-opts="$RANGE" --redact --no-banner --report-format json --report-path /out/report.json; else gitleaks git . --redact --no-banner --report-format json --report-path /out/report.json; fi' || status=$?
          if ! jq -e 'type == "array"' "$out/report.json" > /dev/null 2>&1; then
            echo "::error::gitleaks wrote no readable report"
            exit 1
          fi
          findings=$(jq -r '.[] | "\(.RuleID | tojson) \(.File | tojson):\(.StartLine | tojson) \(.Commit | tojson)"' "$out/report.json")
          if [ -n "$findings" ]; then
            echo "gitleaks found (rule, file:line, commit):"
            printf '%s\n' "$findings"
            [ "$status" -ne 0 ] || status=1
          fi
          exit "$status"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: No known high or critical holes in the production dependencies
        run: pnpm audit --prod --audit-level high

  # A migration on main is never removed or changed and keeps its ID;
  # existing databases would skip it silently. A new migration sorts after
  # the newest migration of the last release (#213, owner, 2026-11-16).
  # Compares the checked-out change (the merge result of a pull request)
  # with the base of the pull request, a push to main with the previous
  # tip of main, the nightly run with itself, and with the last release tag (the newest of all refs; on a
  # hotfix branch its own, and no new migration, O19). Runs for every change.
  migrations:
    name: Migrations append-only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Released migrations are unchanged
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          BASE_REF: ${{ github.base_ref }}
          CREATED: ${{ github.event.created }}
          REF: ${{ github.ref }}
          EVENT: ${{ github.event_name }}
        run: |
          # The nightly run has no previous tip: its tree against itself (no
          # migration added or changed since) and, below, against the last
          # release tag, which is the check that matters then (CodeRabbit on
          # #395).
          if [ "$EVENT" = "schedule" ]; then
            BASE=$GITHUB_SHA
          fi
          # A new hotfix branch has no previous tip: compare it with the
          # release tag it starts from, so commits pushed with it count.
          if [ "$CREATED" = "true" ] && [ "${REF#refs/heads/hotfix/}" != "$REF" ]; then
            BASE=$(git describe --tags --abbrev=0 --match '[0-9]*.[0-9]*.[0-9]*' HEAD) ||
              { echo "::error::A hotfix branch starts at a release tag."; exit 1; }
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "::error::No base commit to compare the migrations with."
            exit 1
          fi
          if [ "${REF#refs/heads/hotfix/}" != "$REF" ] || [ "${BASE_REF#hotfix/}" != "$BASE_REF" ]; then
            # A hotfix brings no migration (O19): nothing beyond the
            # release tag the hotfix branch starts from.
            RELEASE=$(git describe --tags --abbrev=0 --match '[0-9]*.[0-9]*.[0-9]*' HEAD) ||
              { echo "::error::A hotfix branch starts at a release tag."; exit 1; }
            node .github/scripts/migrations-gate.mjs "$BASE" "$RELEASE" --hotfix
          else
            # The last release: the newest CalVer tag of all refs, sorted
            # as versions (26.9.3 before 26.11.22), not only tags below HEAD.
            RELEASE=$(git tag --list '[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
            if [ -z "$RELEASE" ]; then
              echo "::error::No release tag to compare the migrations with."
              exit 1
            fi
            node .github/scripts/migrations-gate.mjs "$BASE" "$RELEASE"
          fi

  # The workflows themselves: actionlint (syntax, expressions, shell) and
  # zizmor (security, e.g. unpinned actions, persisted credentials).
  # Runs for every change, documentation included.
  workflows:
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: |
          docker run --rm -v "$PWD:/repo:ro" -w /repo \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: pipx run zizmor==1.33.1 --format github .github/workflows

  # Regular expressions that take polynomial or exponential time
  # (eslint-plugin-redos, eslint.redos.config.js; #367, owner, 2026-11-25,
  # 80a/81a). Runs for every change, like the workflow lint. The ESLint
  # cache is kept per lockfile and configuration, so only changed files are
  # checked again.
  redos:
    name: ReDoS lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: ESLint cache of the ReDoS lint
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/eslint-redos
          key: redos-${{ hashFiles('pnpm-lock.yaml', 'eslint.redos.config.js', 'eslint.config.js') }}-${{ github.sha }}
          restore-keys: redos-${{ hashFiles('pnpm-lock.yaml', 'eslint.redos.config.js', 'eslint.config.js') }}-
      - run: pnpm lint:redos

  # Static analysis. A finding of security severity 7.0 or more blocks. Runs
  # for every change, documentation included: the ruleset of main waits for a
  # CodeQL result of the exact commit, and a skipped job uploads none.
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    env:
      # Apply the same full analysis to pull requests and main.
      CODEQL_ACTION_DIFF_INFORMED_QUERIES: 'false'
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          output: sarif
      - name: Findings of severity high or above block
        run: node .github/scripts/codeql-gate.mjs sarif

  # The documentation website (okf/ops/website.md): website/ builds the
  # pages of okf/ and docs/, and the build fails on every broken internal
  # link (starlight-links-validator). pages.yml publishes it from main.
  # It also checks every entry of the update log in okf/log/ (#212), so a
  # pull request that changes only the OKF bundle is checked too.
  site:
    name: Documentation website
    needs: changes
    if: needs.changes.outputs.site == 'true' && needs.changes.outputs.proof-site == ''
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: website/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - name: Update log entries well-formed
        run: node ../scripts/okf-log.ts check
      - run: pnpm test
      - name: Build, every internal link checked
        run: pnpm build

  # The single required status check for main. Evaluate even when a job fails
  # or is skipped, and allow skips only when the workflow expects them.
  gate:
    name: CI Gate
    needs:
      [
        changes,
        security,
        migrations,
        workflows,
        redos,
        codeql,
        fragments,
        check,
        e2e,
        mutation-plan,
        mutation-shard,
        mutation,
        mutation-partial-part,
        mutation-partial,
        compose,
        site,
      ]
    if: always()
    runs-on: ubuntu-latest
    # checks: read to verify a mutation result taken over (#167).
    permissions:
      contents: read
      checks: read
    steps:
      # Only to verify a mutation result taken over (#167).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.mutation == 'reuse'
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.changes.outputs.mutation == 'reuse'
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Evaluate the result
        env:
          CHANGES: ${{ needs.changes.result }}
          SECURITY: ${{ needs.security.result }}
          MIGRATIONS: ${{ needs.migrations.result }}
          WORKFLOWS: ${{ needs.workflows.result }}
          REDOS: ${{ needs.redos.result }}
          CODE: ${{ needs.changes.outputs.code }}
          IMAGE: ${{ needs.changes.outputs.image }}
          MUTATED: ${{ needs.changes.outputs.mutation }}
          FRAGMENTS: ${{ needs.fragments.result }}
          CODEQL: ${{ needs.codeql.result }}
          CHECK: ${{ needs.check.result }}
          E2E: ${{ needs.e2e.result }}
          MUTATION_PLAN: ${{ needs.mutation-plan.result }}
          MUTATION_SHARDS: ${{ needs.mutation-shard.result }}
          MUTATION: ${{ needs.mutation.result }}
          MUTATION_PARTIAL_PARTS: ${{ needs.mutation-partial-part.result }}
          MUTATION_PARTIAL: ${{ needs.mutation-partial.result }}
          NIGHTLY: ${{ needs.changes.outputs.mutation-nightly }}
          COMPOSE: ${{ needs.compose.result }}
          SITE_SOURCES: ${{ needs.changes.outputs.site }}
          SITE: ${{ needs.site.result }}
          PROOF_CHECK: ${{ needs.changes.outputs.proof-check }}
          PROOF_E2E: ${{ needs.changes.outputs.proof-e2e }}
          PROOF_MUTATION: ${{ needs.changes.outputs.proof-mutation }}
          PROOF_COMPOSE: ${{ needs.changes.outputs.proof-compose }}
          PROOF_SITE: ${{ needs.changes.outputs.proof-site }}
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.ref_name }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          require_success() {
            if [ "$2" != "success" ]; then
              echo "::error::$1 must succeed (result: $2)"
              exit 1
            fi
          }

          # A job of a push that already succeeded on the identical tree is
          # skipped with its proof, the run and the job that succeeded there
          # (#342): the proof counts only on a push and only for that job,
          # which must then be skipped; without a proof the job must succeed.
          require_success_or_proof() {
            if [ -z "$3" ]; then
              require_success "$1" "$2"
              return
            fi
            if [ "$EVENT" != "push" ]; then
              echo "::error::$1: a proof of an earlier run counts only on a push."
              exit 1
            fi
            if [ "$2" != "skipped" ]; then
              echo "::error::$1 has a proof and must be skipped (result: $2)"
              exit 1
            fi
            echo "$1: skipped, it succeeded on the identical tree: $3"
          }

          require_success "Detect changes" "$CHANGES"
          require_success "Secrets and dependencies" "$SECURITY"
          require_success "Migrations append-only" "$MIGRATIONS"
          require_success "Workflow lint" "$WORKFLOWS"
          require_success "ReDoS lint" "$REDOS"
          require_success "CodeQL" "$CODEQL"

          # A push to main runs no mutation job ("nightly", #370, 200a); a
          # push to hotfix/** runs the complete run unless proven.
          expected=true
          if [ "$EVENT" = "push" ] && [ "$BRANCH" = main ]; then expected=nightly; fi
          if [ "$EVENT" = "push" ] && { [ "$CODE" != "true" ] || [ "$IMAGE" != "true" ] || [ "$MUTATED" != "$expected" ] || [ "$SITE_SOURCES" != "true" ]; }; then
            echo "::error::Pushes to main and hotfix/* must run the full suite (the mutation jobs: $expected); a job is skipped only with its proof (#342)."
            exit 1
          fi
          # The nightly run runs every job but the mutation jobs (#387).
          if [ "$EVENT" = "schedule" ] && { [ "$CODE" != "true" ] || [ "$IMAGE" != "true" ] || [ "$MUTATED" != "false" ] || [ "$SITE_SOURCES" != "true" ]; }; then
            echo "::error::The nightly run runs the unit suite, the E2E suite, the image and the website; the mutation jobs are mutation.yml (#387)."
            exit 1
          fi
          if [ "$EVENT" = "pull_request" ]; then
            require_success "Changelog fragments" "$FRAGMENTS"
          fi

          # A release pull request changes only the metadata files ("Detect
          # changes" refused any other) and runs no expensive job: it relies
          # on the results of its base (owner, 2026-11-23 and 2026-11-24,
          # #387).
          if [ "$EVENT" = "pull_request" ]; then
            case "$HEAD_REF" in
              release/*)
                if [ "$CODE" != "false" ] || [ "$IMAGE" != "false" ] || [ "$MUTATED" != "false" ] || [ "$SITE_SOURCES" != "false" ]; then
                  echo "::error::A release pull request runs no expensive job (detection: code=$CODE image=$IMAGE mutation=$MUTATED site=$SITE_SOURCES)."
                  exit 1
                fi
                echo "Release pull request: metadata only (#387)."
                ;;
            esac
          fi

          case "$CODE" in
            true)
              require_success_or_proof "Lint, types, unit tests and build" "$CHECK" "$PROOF_CHECK"
              require_success_or_proof "E2E tests" "$E2E" "$PROOF_E2E"
              ;;
            false) echo "Documentation-only change." ;;
            *) echo "::error::Missing or invalid change detection output: $CODE"; exit 1 ;;
          esac

          # The mutation jobs may be skipped only when the change detection
          # found nothing they test (#146), or when the pull request takes
          # over the green result of the head before; the gate finds that
          # green run again (#167). A pull request that is no release pull
          # request and goes into no hotfix branch runs the one job for its
          # changed files instead of the shards (#309), in parts at any size
          # (#370). The nightly run it looked at is named (#370, 194a).
          if [ -n "$NIGHTLY" ]; then
            echo "Last nightly complete mutation run: $NIGHTLY"
          fi
          case "$MUTATED" in
            true)
              require_success_or_proof "Mutation plan" "$MUTATION_PLAN" "$PROOF_MUTATION"
              require_success_or_proof "Mutation tests (shards)" "$MUTATION_SHARDS" "$PROOF_MUTATION"
              require_success_or_proof "Mutation tests" "$MUTATION" "$PROOF_MUTATION"
              ;;
            partial)
              case "$EVENT:$HEAD_REF:$BASE_REF" in
                *:*:hotfix/* | push:*)
                  echo "::error::The complete mutation run is required here, not the one for the changed files."
                  exit 1
                  ;;
              esac
              require_success "Mutation tests (changed files, parts)" "$MUTATION_PARTIAL_PARTS"
              require_success "Mutation tests (changed files)" "$MUTATION_PARTIAL"
              if [ "$MUTATION_PLAN" != "skipped" ] || [ "$MUTATION_SHARDS" != "skipped" ] || [ "$MUTATION" != "skipped" ]; then
                echo "::error::The mutation shards must not run next to the job for the changed files."
                exit 1
              fi
              ;;
            false) echo "No mutated file, test, mutation configuration or test tool chain changed: the mutation jobs run on every push to hotfix/** (unless proven on the identical tree) and every night." ;;
            nightly)
              if [ "$EVENT" != "push" ] || [ "$BRANCH" != main ]; then
                echo "::error::Only a push to main leaves the mutation run to the nightly run."
                exit 1
              fi
              if [ "$MUTATION_PLAN" != "skipped" ] || [ "$MUTATION_SHARDS" != "skipped" ] || [ "$MUTATION" != "skipped" ] || [ "$MUTATION_PARTIAL_PARTS" != "skipped" ] || [ "$MUTATION_PARTIAL" != "skipped" ]; then
                echo "::error::A push to main runs no mutation job (#370)."
                exit 1
              fi
              if [ -n "$PROOF_MUTATION" ]; then
                echo "Mutation tests: no run on a push to main, the pull request proved this tree: $PROOF_MUTATION"
              else
                echo "Mutation tests: no run on a push to main and no proof of the pull request; the next nightly complete run (mutation.yml) tests main as it is that night (#370, 200a)."
              fi
              ;;
            reuse)
              if [ "$EVENT" != "pull_request" ] || [ "$MUTATION_PLAN" != "skipped" ] || [ "$MUTATION_SHARDS" != "skipped" ] || [ "$MUTATION" != "skipped" ]; then
                echo "::error::A mutation result is taken over only in a pull request whose mutation jobs are skipped."
                exit 1
              fi
              node scripts/mutation-reuse.ts verify "$PR_HEAD" ||
                { echo "::error::The mutation result to take over was not found."; exit 1; }
              echo "The head only merged main: the green mutation result of the head before is taken over."
              ;;
            *) echo "::error::Missing or invalid mutation detection output: $MUTATED"; exit 1 ;;
          esac

          case "$IMAGE" in
            true) require_success_or_proof "Docker image and Compose stack" "$COMPOSE" "$PROOF_COMPOSE" ;;
            false) echo "No Docker, dependency or start-up file changed: the image is built on main (unless proven on the identical tree) and every night." ;;
            *) echo "::error::Missing or invalid image detection output: $IMAGE"; exit 1 ;;
          esac

          case "$SITE_SOURCES" in
            true) require_success_or_proof "Documentation website" "$SITE" "$PROOF_SITE" ;;
            false) echo "Nothing the documentation website is built from changed." ;;
            *) echo "::error::Missing or invalid website detection output: $SITE_SOURCES"; exit 1 ;;
          esac
