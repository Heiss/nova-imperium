name: CI

# Every push to main or hotfix/* runs the full suite. Pull requests run what
# their changes need: documentation only skips the code checks; the Docker
# image, Trivy and the Compose stack with the upgrade test run when the image
# can change, and always in a release pull request (owner, 2026-11-12). The
# mutation tests run when a pull request changes what Stryker mutates, a test,
# the mutation configuration or the test tool chain (#146), and take over the
# green result of the previous head when the newest head only merged main
# (#167).
# The documentation website is built when its sources change (#144).
# Only the gate job "CI Gate" is the required check of main.
on:
  pull_request:
    # labeled/unlabeled: the label "kein-changelog" changes the fragment check.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main, 'hotfix/**']

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'push' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Only pull requests use changed files to decide which checks to run.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    # checks: read for the check runs of the previous head (#167).
    permissions:
      contents: read
      checks: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
      image: ${{ steps.diff.outputs.image }}
      mutation: ${{ steps.diff.outputs.mutation }}
      site: ${{ steps.diff.outputs.site }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
          persist-credentials: false
      # scripts/mutation-changes.ts needs Node only, no dependencies.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: github.event_name == 'pull_request'
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_REF: ${{ github.head_ref }}
          PR_BASE_REF: ${{ github.base_ref }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$EVENT" = "push" ] || [ -z "$PR_BASE" ]; then
            {
              echo "code=true"
              echo "image=true"
              echo "mutation=true"
              echo "site=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$PR_BASE" "$HEAD_SHA")
          code=false
          image=false
          site=false
          # A release pull request and every pull request into a hotfix
          # branch run everything: they lead straight to a release.
          case "$PR_HEAD_REF" in release/*) code=true; image=true; site=true ;; esac
          case "$PR_BASE_REF" in hotfix/*) code=true; image=true; site=true ;; esac
          while IFS= read -r file; do
            # The website (website/) is documentation: it has its own job.
            case "$file" in
              okf/*|docs/*|changes/*|website/*) ;;
              */*) code=true ;;
              *.md) ;;
              *) code=true ;;
            esac
            # What can change the image, its start, the stack or the upgrade.
            case "$file" in
              Dockerfile|.dockerignore|compose*.yaml|docker/*|package.json|pnpm-lock.yaml|.node-version|scripts/gen-features.ts) image=true ;;
              src/server/db/*|src/server/main.ts|src/server/server.ts|src/server/config.ts|src/server/cli.ts|src/server/maintenance.ts) image=true ;;
              .github/workflows/ci.yml) image=true ;;
            esac
            # What the documentation website is built from (okf/ops/website.md).
            case "$file" in
              okf/*|docs/*|website/*|.github/workflows/ci.yml|.github/workflows/pages.yml) site=true ;;
            esac
          done <<< "$files"
          # The mutation jobs run when the changes touch a file of the mutate
          # globs of stryker.config.json, a test file, the mutation
          # configuration or the versions of Stryker, Vitest or TypeScript in
          # the lockfile (scripts/mutation-changes.ts, owner, 2026-11-13,
          # #146). The release pull request of a hotfix branch changes only
          # CHANGELOG.md, VERSION and changes/: it compares with the release
          # tag the hotfix branch starts from. The release pull request of
          # main runs them as before (#147 decides).
          case "$PR_HEAD_REF" in
            release/hotfix/*)
              # Without a release tag below it the check fails, as the
              # migration check does (owner, 2026-11-13, #146).
              from=$(git describe --tags --abbrev=0 --match '[0-9]*.[0-9]*.[0-9]*' "$PR_BASE") ||
                { echo "::error::A hotfix branch starts at a release tag."; exit 1; }
              mutation=$(node scripts/mutation-changes.ts "$from" "$HEAD_SHA")
              ;;
            release/*) mutation=true ;;
            *) mutation=$(node scripts/mutation-changes.ts "$PR_BASE" "$HEAD_SHA") ;;
          esac
          # A pull request into main whose newest head only merged main takes
          # over the green mutation result of the head before (output
          # "reuse", scripts/mutation-reuse.ts, owner, 2026-11-13, #167).
          # $HEAD_SHA is the merge commit the CI tests, $PR_HEAD the head
          # commit of the branch, on which the check runs are.
          if [ "$mutation" = true ] && [ "$PR_BASE_REF" = main ]; then
            case "$PR_HEAD_REF" in
              release/*) ;;
              *) mutation=$(node scripts/mutation-reuse.ts decide "$PR_BASE" "$HEAD_SHA" "$PR_HEAD") ;;
            esac
          fi
          {
            echo "code=$code"
            echo "image=$image"
            echo "mutation=$mutation"
            echo "site=$site"
          } >> "$GITHUB_OUTPUT"

  # Every pull request that changes the game brings a German changelog
  # fragment in changes/, or carries the label "kein-changelog"; all
  # fragments must be well-formed (scripts/changelog.ts).
  fragments:
    name: Changelog fragments
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
      - name: A fragment for game changes, every fragment well-formed
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: node scripts/changelog.ts check "$PR_BASE"

  check:
    name: Lint, types, unit tests with coverage, build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint --max-warnings 0
      # Dead code, copied code and import rules (knip, jscpd, dependency-cruiser).
      - run: pnpm lint:dead
      - run: pnpm lint:dupes
      - run: pnpm lint:deps
      - run: pnpm format:check
      - run: pnpm typecheck
      # Blocks below 90 % lines and 85 % branches (vitest.config.ts).
      - run: pnpm test:coverage
      - run: pnpm build

  e2e:
    name: E2E tests (browser)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  # Mutation tests in 6 parallel shards (owner, 2026-11-12 and 2026-11-13,
  # #131). The plan splits the files Stryker mutates once for all shards, by
  # the test time of their mutants in the last complete run, else in the last
  # merged report, else by their lines (scripts/mutation-shards.ts). A pull
  # request runs them only when it changes what they test (output mutation,
  # #146), and skips them when it takes over the result of the head before
  # (#167); a push to main or hotfix/** always runs them.
  mutation-plan:
    name: Mutation plan
    needs: changes
    if: needs.changes.outputs.mutation == 'true'
    runs-on: ubuntu-latest
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # TypeScript cuts large files between their top-level statements.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The weights come from the last complete run (nightly or release pull
      # request): an incremental report reuses old results, whose times did
      # not match the run (#131). Without one, the last merged report.
      - name: Merged report of the last complete run (the weights)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: reports/mutation/mutation.json
          key: stryker-weights-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            stryker-weights-${{ github.ref }}-
            stryker-weights-refs/heads/main-
            stryker-report-${{ github.ref }}-
            stryker-report-refs/heads/main-
      - name: Split the mutated files into 6 shards
        id: plan
        run: |
          plan=$(node scripts/mutation-shards.ts plan)
          echo "plan=$plan" >> "$GITHUB_OUTPUT"

  # Each shard keeps its own incremental result: unchanged code keeps its
  # cached result on pull requests and on main. A release pull request and
  # the nightly run (mutation.yml) test every mutant. A shard runs without
  # Stryker's break threshold; the gate below checks the merged report.
  mutation-shard:
    name: Mutation tests (shard ${{ matrix.shard }} of 6)
    needs: [changes, mutation-plan]
    if: needs.changes.outputs.mutation == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Result of the last run of this shard
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: reports/stryker-incremental.json
          key: stryker-shard${{ matrix.shard }}-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            stryker-shard${{ matrix.shard }}-${{ github.ref }}-
            stryker-shard${{ matrix.shard }}-refs/heads/main-
      - name: Configuration of this shard
        env:
          MUTATION_PLAN: ${{ needs.mutation-plan.outputs.plan }}
          SHARD: ${{ matrix.shard }}
        run: node scripts/mutation-shards.ts config "$SHARD"
      - name: Incremental run
        if: ${{ !startsWith(github.head_ref, 'release/') }}
        run: pnpm test:mutation reports/stryker-shard.config.json
      - name: Complete run (release pull request)
        if: startsWith(github.head_ref, 'release/')
        run: pnpm test:mutation reports/stryker-shard.config.json --force
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mutation-shard-${{ matrix.shard }}
          path: reports/mutation/mutation.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  # Merges the 6 shard reports (every shard once, with exactly its files)
  # and checks them as one run: a total mutation score below 80 % fails
  # (break threshold of stryker.config.json), a file below its floor fails
  # too (mutation-standard.json).
  mutation:
    name: Mutation tests
    needs: [changes, mutation-plan, mutation-shard]
    if: needs.changes.outputs.mutation == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: mutation-shard-*
          path: reports/shards
      - name: Merge the shard reports
        id: merge
        env:
          MUTATION_PLAN: ${{ needs.mutation-plan.outputs.plan }}
        run: node scripts/mutation-shards.ts merge reports/mutation/mutation.json reports/shards/*/mutation.json
      - name: Total score and no file below its floor (mutation-standard.json)
        run: node scripts/mutation-gate.ts --report reports/mutation/mutation.json
      - name: Keep the merged report for the next plan
        if: always() && steps.merge.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: reports/mutation/mutation.json
          key: stryker-report-${{ github.ref }}-${{ github.sha }}
      # A release pull request tests every mutant: its report is a complete
      # one and serves as the weights too.
      - name: Keep a complete report as the weights of the next plans
        if: always() && steps.merge.outcome == 'success' && startsWith(github.head_ref, 'release/')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: reports/mutation/mutation.json
          key: stryker-weights-${{ github.ref }}-${{ github.sha }}

  compose:
    name: Docker image and Compose stack
    needs: changes
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    env:
      NOVA_VERSION: ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The Trivy gate builds the image of the base branch too.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: The production setup is valid, and a missing value is named
        run: |
          mkdir -p secrets && : > secrets/smtp_password
          NOVA_PUBLIC_URL=https://game.example.org docker compose --env-file /dev/null -f compose.yaml config -q
          if docker compose --env-file /dev/null -f compose.yaml config -q 2> missing.txt; then
            echo 'compose.yaml must require NOVA_PUBLIC_URL'; exit 1
          fi
          grep NOVA_PUBLIC_URL missing.txt
          rm secrets/smtp_password
      # The demo: Mailpit as the mail sink, COMPOSE_FILE with compose.demo.yaml.
      - run: docker/init-env.sh --demo
      - name: Make the demo secret readable by the container user
        run: sudo chown 1000:1000 secrets/smtp_password
      # Upgrade as on the server (owner, 2026-11-11): the last release writes
      # data, then the new image starts on the same volume.
      - name: Start the last release and write data
        env:
          NOVA_VERSION: latest
        run: |
          docker compose pull app
          docker compose up --detach --no-build --wait
          docker/upgrade.sh before
      - name: Build the application image from the Dockerfile
        run: docker compose build app
      - name: Start the stack with the image built above
        run: docker compose up --detach --no-build --wait
      - name: Data of the last release survive the upgrade
        run: docker/upgrade.sh after
      # Trivy gate (owner, 2026-11-12), holes with a fix only. What goes out
      # as a release (a release pull request, a pull request into or a push
      # to hotfix/**) blocks on every High and Critical hole. Every other
      # run blocks on Critical; a pull request only on the Critical holes
      # it brings in: the image of its base branch is scanned too, so two
      # Renovate pull requests that each fix one of two holes do not block
      # each other (scripts/trivy-gate.ts).
      - name: Trivy gate mode
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          REF: ${{ github.ref }}
        run: |
          severity=CRITICAL
          mode=new
          [ "$EVENT" = pull_request ] || mode=all
          case "$HEAD_REF" in release/*) severity=HIGH,CRITICAL; mode=all ;; esac
          case "$BASE_REF" in hotfix/*) severity=HIGH,CRITICAL; mode=all ;; esac
          case "$REF" in refs/heads/hotfix/*) severity=HIGH,CRITICAL; mode=all ;; esac
          echo "severity=$severity" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Blocking: $severity, $([ "$mode" = new ] && echo 'only holes this pull request brings in' || echo 'every hole')"
      - name: Build the image of the base branch
        if: steps.gate.outputs.mode == 'new'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git worktree add --detach ../base "$BASE_SHA"
          docker build --target app --tag nova-base:ci ../base
      - name: Trivy gate (holes with a fix only)
        env:
          SEVERITY: ${{ steps.gate.outputs.severity }}
          MODE: ${{ steps.gate.outputs.mode }}
        run: |
          scan() {
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/out" \
              aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb \
              image --scanners vuln --severity "$SEVERITY" --ignore-unfixed --format json \
              --output "/out/$2" --no-progress "$1"
          }
          scan "ghcr.io/heiss/nova-imperium:$NOVA_VERSION" trivy-image.json
          if [ "$MODE" = new ]; then
            scan nova-base:ci trivy-base.json
            node scripts/trivy-gate.ts trivy-image.json trivy-base.json
          else
            node scripts/trivy-gate.ts trivy-image.json
          fi
      - name: The image holds no compiler, package manager or tests
        run: |
          docker compose exec -T app sh -c '! command -v npm && ! command -v pnpm && ! command -v gcc && [ -z "$(find /app/src -name "*.test.ts")" ]'
      - name: A wrong setting stops the start with a message
        run: |
          if docker compose run --rm --no-deps -e NOVA_SESSION_DAYS=0 app > wrong.txt 2>&1; then
            echo 'the server must refuse NOVA_SESSION_DAYS=0'; exit 1
          fi
          grep 'NOVA_SESSION_DAYS' wrong.txt
      - name: Smoke test (headers, invitation mail, registration, data after a restart)
        run: docker/smoke.sh
      - name: Logs
        if: failure()
        run: docker compose logs --no-color --tail 60
      - name: Remove the Compose stack
        if: always()
        run: docker compose down --volumes

  # Secrets in the whole history and known holes in the production
  # dependencies. Runs for every change, documentation included.
  security:
    name: Secrets and dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: No secrets in the history (gitleaks, exceptions in .gitleaksignore)
        run: |
          docker run --rm -v "$PWD:/repo" --entrypoint sh zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f -c \
            'git config --global --add safe.directory /repo && cd /repo && gitleaks git . --redact --no-banner'
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: No known high or critical holes in the production dependencies
        run: pnpm audit --prod --audit-level high

  # A released migration is never moved, removed or changed; existing
  # databases would skip it silently. Compares the checked-out change (the
  # merge result of a pull request) with the base of the pull request, or a
  # push to main with the previous tip of main. Runs for every change.
  migrations:
    name: Migrations append-only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
      - name: Released migrations are unchanged
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CREATED: ${{ github.event.created }}
          REF: ${{ github.ref }}
        run: |
          # A new hotfix branch has no previous tip: compare it with the
          # release tag it starts from, so commits pushed with it count.
          if [ "$CREATED" = "true" ] && [ "${REF#refs/heads/hotfix/}" != "$REF" ]; then
            BASE=$(git describe --tags --abbrev=0 --match '[0-9]*.[0-9]*.[0-9]*' HEAD) ||
              { echo "::error::A hotfix branch starts at a release tag."; exit 1; }
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "::error::No base commit to compare the migrations with."
            exit 1
          fi
          node .github/scripts/migrations-gate.mjs "$BASE"

  # The workflows themselves: actionlint (syntax, expressions, shell) and
  # zizmor (security, e.g. unpinned actions, persisted credentials).
  # Runs for every change, documentation included.
  workflows:
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: actionlint
        run: |
          docker run --rm -v "$PWD:/repo:ro" -w /repo \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: pipx run zizmor==1.32.0 --format github .github/workflows

  # Static analysis. A finding of security severity 7.0 or more blocks. Runs
  # for every change, documentation included: the ruleset of main waits for a
  # CodeQL result of the exact commit, and a skipped job uploads none.
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    env:
      # Apply the same full analysis to pull requests and main.
      CODEQL_ACTION_DIFF_INFORMED_QUERIES: 'false'
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          output: sarif
      - name: Findings of severity high or above block
        run: node .github/scripts/codeql-gate.mjs sarif

  # The documentation website (okf/ops/website.md): website/ builds the
  # pages of okf/ and docs/, and the build fails on every broken internal
  # link (starlight-links-validator). pages.yml publishes it from main.
  site:
    name: Documentation website
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          package_json_file: website/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm test
      - name: Build, every internal link checked
        run: pnpm build

  # The single required status check for main. Evaluate even when a job fails
  # or is skipped, and allow skips only when the workflow expects them.
  gate:
    name: CI Gate
    needs:
      [
        changes,
        security,
        migrations,
        workflows,
        codeql,
        fragments,
        check,
        e2e,
        mutation-plan,
        mutation-shard,
        mutation,
        compose,
        site,
      ]
    if: always()
    runs-on: ubuntu-latest
    # checks: read to verify a mutation result taken over (#167).
    permissions:
      contents: read
      checks: read
    steps:
      # Only to verify a mutation result taken over (#167).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.changes.outputs.mutation == 'reuse'
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: needs.changes.outputs.mutation == 'reuse'
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Evaluate the result
        env:
          CHANGES: ${{ needs.changes.result }}
          SECURITY: ${{ needs.security.result }}
          MIGRATIONS: ${{ needs.migrations.result }}
          WORKFLOWS: ${{ needs.workflows.result }}
          CODE: ${{ needs.changes.outputs.code }}
          IMAGE: ${{ needs.changes.outputs.image }}
          MUTATED: ${{ needs.changes.outputs.mutation }}
          FRAGMENTS: ${{ needs.fragments.result }}
          CODEQL: ${{ needs.codeql.result }}
          CHECK: ${{ needs.check.result }}
          E2E: ${{ needs.e2e.result }}
          MUTATION_PLAN: ${{ needs.mutation-plan.result }}
          MUTATION_SHARDS: ${{ needs.mutation-shard.result }}
          MUTATION: ${{ needs.mutation.result }}
          COMPOSE: ${{ needs.compose.result }}
          SITE_SOURCES: ${{ needs.changes.outputs.site }}
          SITE: ${{ needs.site.result }}
          EVENT: ${{ github.event_name }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          require_success() {
            if [ "$2" != "success" ]; then
              echo "::error::$1 must succeed (result: $2)"
              exit 1
            fi
          }

          require_success "Detect changes" "$CHANGES"
          require_success "Secrets and dependencies" "$SECURITY"
          require_success "Migrations append-only" "$MIGRATIONS"
          require_success "Workflow lint" "$WORKFLOWS"
          require_success "CodeQL" "$CODEQL"

          if [ "$EVENT" = "push" ] && { [ "$CODE" != "true" ] || [ "$IMAGE" != "true" ] || [ "$MUTATED" != "true" ] || [ "$SITE_SOURCES" != "true" ]; }; then
            echo "::error::Pushes to main and hotfix/* must run the full suite."
            exit 1
          fi
          if [ "$EVENT" = "pull_request" ]; then
            require_success "Changelog fragments" "$FRAGMENTS"
          fi

          case "$CODE" in
            true)
              require_success "Lint, types, unit tests and build" "$CHECK"
              require_success "E2E tests" "$E2E"
              ;;
            false) echo "Documentation-only change." ;;
            *) echo "::error::Missing or invalid change detection output: $CODE"; exit 1 ;;
          esac

          # The mutation jobs may be skipped only when the change detection
          # found nothing they test (#146), or when the pull request takes
          # over the green result of the head before; the gate finds that
          # green run again (#167).
          case "$MUTATED" in
            true)
              require_success "Mutation plan" "$MUTATION_PLAN"
              require_success "Mutation tests (shards)" "$MUTATION_SHARDS"
              require_success "Mutation tests" "$MUTATION"
              ;;
            false) echo "No mutated file, test, mutation configuration or test tool chain changed: the mutation jobs run on every push to main and hotfix/** and every night." ;;
            reuse)
              if [ "$EVENT" != "pull_request" ] || [ "$MUTATION_PLAN" != "skipped" ] || [ "$MUTATION_SHARDS" != "skipped" ] || [ "$MUTATION" != "skipped" ]; then
                echo "::error::A mutation result is taken over only in a pull request whose mutation jobs are skipped."
                exit 1
              fi
              node scripts/mutation-reuse.ts verify "$PR_HEAD" ||
                { echo "::error::The mutation result to take over was not found."; exit 1; }
              echo "The head only merged main: the green mutation result of the head before is taken over."
              ;;
            *) echo "::error::Missing or invalid mutation detection output: $MUTATED"; exit 1 ;;
          esac

          case "$IMAGE" in
            true) require_success "Docker image and Compose stack" "$COMPOSE" ;;
            false) echo "No Docker, dependency or start-up file changed: the image is built on main and in the release pull request." ;;
            *) echo "::error::Missing or invalid image detection output: $IMAGE"; exit 1 ;;
          esac

          case "$SITE_SOURCES" in
            true) require_success "Documentation website" "$SITE" ;;
            false) echo "Nothing the documentation website is built from changed." ;;
            *) echo "::error::Missing or invalid website detection output: $SITE_SOURCES"; exit 1 ;;
          esac
