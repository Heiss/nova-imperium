name: Tag a merged release

# A merged release pull request changes VERSION; after its successful CI push
# run, scripts/release.sh tags that commit with the version (owner,
# 2026-11-12). Every other push is not tagged.
on:
  # Safe here: runs only after a successful CI push run on main or hotfix/*
  # of this repository and checks out that branch, never pull request code.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [CI]
    branches: [main, 'hotfix/**']
    types: [completed]

permissions:
  contents: read
  actions: read

# One group per commit: a single shared group keeps only one pending run, so
# a release commit waiting behind another run could be dropped by the run of
# a later commit. Different commits never compete for the same tag; a taken
# version fails scripts/release.sh loudly.
concurrency:
  group: tag-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  # Without the key: does the commit of the CI run change VERSION? Only the
  # merge of a release pull request does; every other push stops here and
  # creates no deployment of the environment release.
  check:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      vars.RELEASE_APP_ID != ''
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Did this commit change VERSION?
        id: version
        run: |
          if git rev-parse -q --verify HEAD^ > /dev/null &&
            ! git diff --quiet HEAD^ HEAD -- VERSION; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "VERSION changed: tagging $(tr -d '[:space:]' < VERSION)."
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo 'VERSION is unchanged: no release pull request, no tag.'
          fi

  tag:
    needs: check
    if: needs.check.outputs.release == 'true'
    # The key is an environment secret: only jobs on main and hotfix/**, which
    # change only through pull requests with a green CI Gate, receive it
    # (owner, 2026-11-12; CodeRabbit security finding on pull request #84).
    environment: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: app
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      # Keeps the credentials: scripts/release.sh pushes the tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }} # zizmor: ignore[artipacked]
      - name: Tag the release if this commit changed VERSION
        env:
          NOVA_RELEASE_EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
          NOVA_RELEASE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          NOVA_RELEASE_CI_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'Nova Imperium Release'
          git config user.email 'nova-imperium-release@users.noreply.github.com'
          sh scripts/release.sh
