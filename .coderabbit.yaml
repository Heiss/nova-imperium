# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# AI review of every pull request (owner, 2026-11-11). CodeRabbit comments and
# never requests changes. Which findings block a merge is decided by O4 in
# okf/ops/branching-release.md: security findings and „Critical“ ones.
language: en-US
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  auto_review:
    enabled: true
    # Review when a pull request is opened or marked ready, not drafts and
    # not every later push (owner, 2026-11-11).
    drafts: false
    auto_incremental_review: false
    # Also pull requests into other branches, for example stacked ones.
    base_branches: ['.*']
  path_filters:
    - '!pnpm-lock.yaml'
    - '!src/test/legacy/**'
    - '!docs/design/**'
    - '!**/*.svg'
  path_instructions:
    - path: 'src/server/**'
      instructions: >-
        Security first: authentication, sessions, passkeys, account
        recovery and deletion, authorization of every action, input
        validation, rate limits, SQL through prepared statements only,
        secrets never logged. Flag any game rule computed here that should
        live in src/core.
    - path: 'src/core/**'
      instructions: >-
        Pure game rules used by the server and the browser alike. No I/O,
        no imports from src/server or src/client. Values of version 1 must
        stay identical (equivalence tests).
    - path: 'src/client/**'
      instructions: >-
        The interface is German; check the German texts. No inline scripts
        or styles (strict Content-Security-Policy). Rules come from
        src/core, not from new client code.
    - path: 'src/server/db/schema.ts'
      instructions: >-
        Released migrations are append-only: a moved, removed or changed
        migration is a blocking error. New migrations go at the end.
    - path: '.github/workflows/**'
      instructions: >-
        Actions pinned to commit hashes, least permissions, no persisted
        credentials unless the job pushes.
    - path: 'changes/**'
      instructions: >-
        Changelog fragments for players (changes/README.md): German, written
        for players, one change per file, front matter "art" is neu,
        geändert or behoben, at most 300 characters, no headings. Check that
        the text matches what the pull request really changes, and that it
        reveals no internals, secrets or hidden game mechanics.
    - path: 'CHANGELOG.md'
      instructions: >-
        Written by the release pull request from changes/. German, for
        players. Check that every entry still matches its pull request and
        that the sections are complete; never edited by hand otherwise.
    - path: 'okf/**'
      instructions: >-
        OKF bundle of decisions. Check that markers (E, V, U) and links are
        consistent; do not judge the decisions themselves.
chat:
  auto_reply: true
