<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Studie – Felder des Schlachtfelds</title>
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="mock.css" />
    <style>
      .tiles {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
      }
      .tile {
        background: var(--box);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 10px;
        display: grid;
        grid-template-columns: 64px 1fr;
        gap: 10px;
        font-size: 15px;
      }
      .tile h3 {
        margin: 0 0 2px;
        font: 600 15px var(--head);
        color: var(--gold-hi);
        letter-spacing: 0.04em;
      }
      .tile .who {
        font-size: 13px;
        color: var(--dim);
      }
      .up {
        color: var(--green);
      }
      .down {
        color: var(--red);
      }
      .grp {
        font: 600 14px var(--head);
        color: var(--gold);
        letter-spacing: 0.08em;
        margin: 16px 0 8px;
      }
    </style>
  </head>
  <body>
    <main class="mock" style="max-width: 1240px">
      <p class="cap">
        Studie [V] · Bodenkampf · Katalog der Feldtypen · Ideensammlung, bewusst
        unbalanciert, keine Spielwerte
      </p>
      <h2>Felder des Schlachtfelds</h2>
      <div id="tiles"></div>
    </main>
    <script>
      const hex = (fill, stroke, glyph) =>
        `<svg width="64" height="70" viewBox="0 0 64 70" aria-hidden="true"><polygon points="32,3 61,19 61,51 32,67 3,51 3,19" fill="${fill}" stroke="${stroke}" stroke-width="3"/>${glyph}</svg>`;
      const groups = [
        [
          'Stellungen',
          [
            [
              'Bunker',
              '#3a2c18',
              '#d4a537',
              '<rect x="18" y="28" width="28" height="16" fill="none" stroke="#f1d27a" stroke-width="3"/><rect x="26" y="32" width="12" height="4" fill="#f1d27a"/>',
              '<span class="up">+50 % Angriff, +50 % Verteidigung</span>',
              'Start: Verteidiger · eroberbar',
            ],
            [
              'Lazarett',
              '#1d3a2a',
              '#9ccb76',
              '<path d="M32 22v26M19 35h26" stroke="#9ccb76" stroke-width="6"/>',
              '<span class="down">−30 % Angriff</span> · <span class="up">+10 LP je Runde</span>',
              'beide Seiten',
            ],
            [
              'Ruine',
              '#2b2219',
              '#9a8c74',
              '<path d="M18 46V28h8v8h8V24h10v22" fill="none" stroke="#9a8c74" stroke-width="3"/>',
              '<span class="up">Deckung: −40 % Fernkampftreffer</span>',
              'beide · zerstörbar',
            ],
            [
              'Einsturzgebäude',
              '#33241a',
              '#e08a2a',
              '<path d="M20 48L26 22L38 24L44 48Z" fill="none" stroke="#e08a2a" stroke-width="3"/><path d="M28 30l8 10" stroke="#e08a2a" stroke-width="3"/>',
              'Wird beschossen → stürzt ein, <span class="down">Schaden an allen darin</span>, wird Ruine',
              'beide',
            ],
          ],
        ],
        [
          'Nur für eine Seite',
          [
            [
              'Tunnel',
              '#120d0a',
              '#7fd3f5',
              '<circle cx="32" cy="35" r="11" fill="#0d0a08" stroke="#7fd3f5" stroke-width="3"/><path d="M14 52q18-10 36 0" stroke="#7fd3f5" stroke-width="2" fill="none" stroke-dasharray="3 3"/>',
              'Verteidiger springen zwischen Tunnelausgängen',
              '<b>nur Verteidiger</b>',
            ],
            [
              'Landezone',
              '#3a1420',
              '#ee7660',
              '<path d="M32 18v22M22 32l10 10l10-10" stroke="#ee7660" stroke-width="4" fill="none"/><path d="M18 50h28" stroke="#ee7660" stroke-width="3"/>',
              'Verstärkungen und Nachschub erscheinen hier',
              '<b>nur Angreifer</b>',
            ],
            [
              'Minenfeld',
              '#231a14',
              '#7fd3f5',
              '<circle cx="24" cy="30" r="4" fill="#7fd3f5"/><circle cx="40" cy="28" r="4" fill="#7fd3f5"/><circle cx="32" cy="44" r="4" fill="#7fd3f5"/>',
              '<span class="down">25 Schaden beim Betreten</span> · verdeckt',
              'sichtbar nur für Verteidiger',
            ],
            [
              'Energiezaun',
              '#1a2430',
              '#7fd3f5',
              '<path d="M14 26h36M14 35h36M14 44h36" stroke="#7fd3f5" stroke-width="2"/><path d="M20 22v26M44 22v26" stroke="#f1d27a" stroke-width="3"/>',
              'Verteidiger gehen durch, Angreifer nicht · fällt, wenn der Generator fällt',
              '<b>nur Verteidiger</b>',
            ],
          ],
        ],
        [
          'Kontrollpunkte (halten = Fähigkeit)',
          [
            [
              'Kommandohöhe',
              '#3a2c18',
              '#f1d27a',
              '<path d="M24 50V20l16 6-16 6" fill="#f1d27a" stroke="#f1d27a" stroke-width="2"/>',
              'Gehalten: <b>Orbitalschlag</b> freigeschaltet',
              'beide',
            ],
            [
              'Sensorturm',
              '#1a2430',
              '#f1d27a',
              '<path d="M32 50V30M22 22q10-10 20 0M18 16q14-14 28 0" stroke="#f1d27a" stroke-width="3" fill="none"/>',
              'Gehalten: <b>Aufdecken</b> (Minen, Getarnte) in Reichweite 4',
              'beide',
            ],
            [
              'Generator',
              '#1d3a2a',
              '#f1d27a',
              '<path d="M36 18L24 38h10l-4 16l14-22H34z" fill="#f1d27a"/>',
              'Gehalten: +1 Befehlspunkt je Runde, <b>Schildfeld</b>',
              'beide',
            ],
            [
              'Rohstofflager',
              '#2b2219',
              '#c9c2b6',
              '<rect x="18" y="26" width="28" height="20" fill="none" stroke="#c9c2b6" stroke-width="3"/><path d="M18 34h28" stroke="#c9c2b6" stroke-width="2"/>',
              'Gehalten am Rundenende: <span class="up">Beute für den Halter</span>',
              'Verteidiger: Einkommen trotz Belagerung',
            ],
          ],
        ],
        [
          'Gelände und Gefahren',
          [
            [
              'Krater',
              '#120d0a',
              '#5a4a3a',
              '<circle cx="32" cy="35" r="13" fill="none" stroke="#5a4a3a" stroke-width="4"/>',
              'Unpassierbar · blockiert keine Sicht',
              '–',
            ],
            [
              'Strahlung',
              '#2a3010',
              '#d6e05a',
              '<circle cx="32" cy="35" r="4" fill="#d6e05a"/><path d="M32 35L22 20a18 18 0 0 1 20 0z M32 35L50 40a18 18 0 0 1-10 16z M32 35L24 56a18 18 0 0 1-10-16z" fill="#d6e05a" opacity="0.8"/>',
              '<span class="down">8 Schaden je Runde</span> · <span class="up">+2 Sichtweite</span>',
              'beide',
            ],
            [
              'Eisfläche',
              '#1a2a36',
              '#7fd3f5',
              '<path d="M16 46l32-22M22 30l20 16" stroke="#7fd3f5" stroke-width="2"/>',
              '<span class="up">+2 Bewegung</span> · <span class="down">−20 % Verteidigung</span> (nur Eisplaneten, #52)',
              'beide',
            ],
            [
              'Lavaspalte',
              '#3a1408',
              '#ee7660',
              '<path d="M18 22q10 14 0 26M34 20q8 16 0 30M46 24q-6 12 2 22" stroke="#ee7660" stroke-width="4" fill="none"/>',
              'Wandert jede 3. Runde ein Feld · <span class="down">tödlich</span> (nur Wüsten-/Trockenplaneten)',
              'beide',
            ],
          ],
        ],
      ];
      let html = '';
      for (const [g, items] of groups) {
        html += `<div class="grp">${g}</div><div class="tiles">`;
        for (const [n, f, s, glyph, fx, who] of items)
          html += `<div class="tile">${hex(f, s, glyph)}<div><h3>${n}</h3><div>${fx}</div><div class="who">${who}</div></div></div>`;
        html += '</div>';
      }
      document.getElementById('tiles').innerHTML = html;
    </script>
  </body>
</html>
