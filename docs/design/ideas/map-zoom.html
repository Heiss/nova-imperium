<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Studie – Zoombare Sternenkarte</title>
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="mock.css" />
    <style>
      .war {
        display: grid;
        grid-template-columns: 1fr 300px;
        gap: 14px;
      }
      .map {
        background: #07050a;
        border: 1px solid var(--line);
        border-radius: 6px;
        overflow: hidden;
        position: relative;
      }
      .map svg {
        display: block;
        cursor: zoom-in;
      }
      .crumbs {
        display: flex;
        gap: 6px;
        align-items: center;
        flex-wrap: wrap;
        margin-bottom: 10px;
        font: 600 14px var(--head);
        letter-spacing: 0.04em;
      }
      .crumbs a {
        color: var(--dim);
        cursor: pointer;
      }
      .crumbs a.on {
        color: var(--gold-hi);
      }
      .crumbs span.sep {
        color: var(--line);
      }
      .zoom {
        position: absolute;
        right: 10px;
        top: 10px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .zoom button {
        min-width: 0;
        width: 34px;
        padding: 2px 0;
      }
      .lv {
        position: absolute;
        left: 12px;
        bottom: 10px;
        font: 600 12px var(--head);
        color: var(--dim);
        letter-spacing: 0.08em;
      }
      .lv b {
        color: var(--gold-hi);
      }
      .hint {
        font-size: 14px;
        color: var(--dim);
      }
    </style>
  </head>
  <body>
    <main class="mock" style="max-width: 1240px">
      <p class="cap">
        Studie [V] · Sternenkarte mit festen Zoomstufen: Universum → Galaxie →
        System → Planet · Klick zoomt hinein, Mausrad eine Stufe zum Zeiger, Esc
        heraus · Beispieldaten
      </p>
      <nav class="crumbs" id="crumbs" aria-label="Zoomstufen"></nav>
      <div class="war">
        <div class="map">
          <svg
            id="v"
            viewBox="0 0 860 520"
            width="100%"
            role="img"
            aria-label="Zoombare Sternenkarte"
          ></svg>
          <div class="zoom">
            <button id="zin" aria-label="Hineinzoomen">+</button
            ><button id="zout" aria-label="Herauszoomen">−</button>
          </div>
          <div class="lv" id="lv"></div>
        </div>
        <aside>
          <div class="box">
            <div class="hd" id="ph"></div>
            <div class="bd" id="pb"></div>
          </div>
          <p class="hint">
            Telefon: Antippen zoomt hinein, zwei Finger wechseln die Stufe,
            „Zurück“ geht heraus. Jede Stufe hat eine eigene URL.
          </p>
        </aside>
      </div>
    </main>
    <script>
      const svg = document.getElementById('v');
      const NS = 'http://www.w3.org/2000/svg';
      const W = 860,
        H = 520,
        CX = 430,
        CY = 260;
      const LEVELS = ['Universum', 'Galaxie', 'System', 'Planet'];
      const state = { lv: 0, g: 1, s: 27, p: 8 };
      const own = { 1: [9, 12, 27], 2: [4] },
        enemy = { 1: [5, 18, 38, 44], 2: [30], 3: [11, 22] };
      const PTYPE = [
        '#e0a060',
        '#e0a060',
        '#c98a4a',
        '#9ccb76',
        '#9ccb76',
        '#5a9a4a',
        '#5a9a4a',
        '#3a7ab0',
        '#3a7ab0',
        '#cfe8f5',
        '#cfe8f5',
        '#c9b07a',
        '#c9b07a',
        '#9ccb76',
        '#c9b07a',
      ];
      const sysPos = (s) => {
        const t = s - 1,
          a = t * 0.3 + 0.3,
          r = 34 + t * 5.6;
        return [CX + Math.cos(a) * r * 1.35, CY + Math.sin(a) * r * 0.95];
      };
      const galPos = (g) => [110 + (g - 1) * 160, CY + (g % 2 ? -30 : 30)];
      const orbit = (p) => {
        const rx = 50 + p * 24,
          ry = rx * 0.55,
          a = p * 1.7;
        return [CX + Math.cos(a) * rx, CY + Math.sin(a) * ry];
      };
      const planetsIn = (s) => ({
        2: 'Vex',
        3: 'Kaiser',
        5: 'Mira',
        8: s === 27 ? 'Vex' : 'Orrin',
        11: own[1].includes(s) ? 'du' : 'Nyx',
        14: 'Orrin',
      });

      function el(tag, attrs, parent) {
        const e = document.createElementNS(NS, tag);
        for (const k in attrs) e.setAttribute(k, attrs[k]);
        if (parent) parent.appendChild(e);
        return e;
      }
      function text(parent, x, y, s, attrs = {}) {
        const t = el(
          'text',
          {
            x,
            y,
            'font-family': 'Cinzel, serif',
            'font-size': 13,
            fill: '#a8997f',
            'text-anchor': 'middle',
            ...attrs,
          },
          parent,
        );
        t.textContent = s;
        return t;
      }

      function drawUniverse(g0) {
        for (let i = 0; i < 260; i++)
          el(
            'circle',
            {
              cx: (i * 137.5) % W,
              cy: (i * 59.3) % H,
              r: 0.7,
              fill: '#5a4a3a',
            },
            g0,
          );
        for (let g = 1; g <= 5; g++) {
          const [x, y] = galPos(g);
          const grp = el('g', { 'data-k': g, style: 'cursor:zoom-in' }, g0);
          el(
            'ellipse',
            {
              cx: x,
              cy: y,
              rx: 62,
              ry: 40,
              fill: '#1a1411',
              stroke: '#3b2f22',
            },
            grp,
          );
          for (let s = 1; s <= 50; s += 2) {
            const [sx, sy] = sysPos(s);
            el(
              'circle',
              {
                cx: x + (sx - CX) * 0.2,
                cy: y + (sy - CY) * 0.2,
                r: 1.2,
                fill: '#c9c2b6',
              },
              grp,
            );
          }
          el(
            'circle',
            { cx: x, cy: y, r: 9, fill: '#f1d27a', opacity: 0.35 },
            grp,
          );
          text(grp, x, y + 62, `Galaxie ${g}`, {
            fill: '#f1d27a',
            'font-size': 14,
          });
          const o = (own[g] || []).length,
            e = (enemy[g] || []).length;
          text(grp, x, y + 80, `${o} eigene · ${e} andere`, {
            'font-size': 11,
            'font-family': 'EB Garamond, serif',
          });
          if (g === 1)
            el(
              'circle',
              { cx: x + 52, cy: y - 34, r: 6, fill: '#ee7660' },
              grp,
            );
        }
        text(
          g0,
          430,
          40,
          'Abstand zwischen Galaxien = Reihenfolge, wie die Flugzeit',
          {
            'font-size': 12,
            fill: '#9a8c74',
            'font-family': 'EB Garamond, serif',
          },
        );
      }
      function drawGalaxy(g0) {
        for (let i = 0; i < 260; i++)
          el(
            'circle',
            {
              cx: (i * 137.5) % W,
              cy: (i * 59.3) % H,
              r: 0.7,
              fill: '#5a4a3a',
            },
            g0,
          );
        el(
          'circle',
          { cx: CX, cy: CY, r: 110, fill: '#f1d27a', opacity: 0.08 },
          g0,
        );
        for (let s = 1; s <= 50; s++) {
          const [x, y] = sysPos(s),
            o = (own[state.g] || []).includes(s),
            e = (enemy[state.g] || []).includes(s);
          const grp = el('g', { 'data-k': s, style: 'cursor:zoom-in' }, g0);
          el('circle', { cx: x, cy: y, r: 12, fill: 'transparent' }, grp);
          el(
            'circle',
            {
              cx: x,
              cy: y,
              r: o ? 5 : 3,
              fill: o ? '#f1d27a' : e ? '#7fd3f5' : '#c9c2b6',
            },
            grp,
          );
          if ([1, 9, 12, 27, 38, 50].includes(s))
            text(grp, x + 12, y - 6, s, {
              'font-size': 11,
              'text-anchor': 'start',
              'font-family': 'EB Garamond, serif',
            });
        }
      }
      function drawSystem(g0) {
        el(
          'circle',
          { cx: CX, cy: CY, r: 34, fill: '#f0a050', opacity: 0.85 },
          g0,
        );
        el(
          'circle',
          { cx: CX, cy: CY, r: 52, fill: '#f0a050', opacity: 0.15 },
          g0,
        );
        const pl = planetsIn(state.s);
        for (let p = 1; p <= 15; p++) {
          const rx = 50 + p * 24,
            ry = rx * 0.55;
          el(
            'ellipse',
            { cx: CX, cy: CY, rx, ry, fill: 'none', stroke: '#2a2018' },
            g0,
          );
          if (!pl[p]) continue;
          const [x, y] = orbit(p),
            me = pl[p] === 'du';
          const grp = el('g', { 'data-k': p, style: 'cursor:zoom-in' }, g0);
          el(
            'circle',
            {
              cx: x,
              cy: y,
              r: 11,
              fill: PTYPE[p - 1],
              stroke: me ? '#f1d27a' : '#0d0a08',
              'stroke-width': me ? 3 : 1,
            },
            grp,
          );
          text(grp, x, y - 16, `${p} · ${pl[p]}`, {
            'font-size': 12,
            'font-family': 'EB Garamond, serif',
            fill: me ? '#f1d27a' : '#a8997f',
          });
          if (p === 8) {
            el(
              'circle',
              { cx: x + 18, cy: y + 6, r: 3.5, fill: '#c9c2b6' },
              grp,
            );
          }
        }
        for (let i = 0; i < 140; i++) {
          const a = i * 0.3,
            rx = 50 + 16 * 24 + ((i * 7) % 8),
            ry = rx * 0.55;
          el(
            'circle',
            {
              cx: CX + Math.cos(a) * rx,
              cy: CY + Math.sin(a) * ry,
              r: 1.3,
              fill: '#7a6a5a',
            },
            g0,
          );
        }
      }
      function drawPlanet(g0) {
        const defs = el('defs', {}, g0);
        const gr = el(
          'radialGradient',
          { id: 'pg', cx: '35%', cy: '35%' },
          defs,
        );
        el('stop', { offset: '0', 'stop-color': '#9ad0ff' }, gr);
        el('stop', { offset: '0.6', 'stop-color': PTYPE[state.p - 1] }, gr);
        el('stop', { offset: '1', 'stop-color': '#0b1424' }, gr);
        el('circle', { cx: CX, cy: CY, r: 150, fill: 'url(#pg)' }, g0);
        el(
          'ellipse',
          {
            cx: CX,
            cy: CY,
            rx: 230,
            ry: 60,
            fill: 'none',
            stroke: '#c9c2b6',
            'stroke-dasharray': '3 6',
            opacity: 0.5,
          },
          g0,
        );
        el('circle', { cx: CX + 226, cy: CY - 12, r: 22, fill: '#c9c2b6' }, g0);
        text(g0, CX + 226, CY + 30, 'Mond', { 'font-size': 12 });
        for (let i = 0; i < 26; i++)
          el(
            'rect',
            {
              x: CX - 230 + ((i * 37) % 70),
              y: CY + 90 + ((i * 13) % 40),
              width: 4,
              height: 3,
              fill: '#9a8c74',
              transform: `rotate(${i * 23} ${CX - 200} ${CY + 110})`,
            },
            g0,
          );
        text(g0, CX - 200, CY + 160, 'Trümmerfeld', { 'font-size': 12 });
      }
      const DRAW = [drawUniverse, drawGalaxy, drawSystem, drawPlanet];

      function panel() {
        const ph = document.getElementById('ph'),
          pb = document.getElementById('pb');
        const L = state.lv;
        if (L === 0) {
          ph.textContent = 'Universum';
          pb.innerHTML =
            '5 Galaxien · Klick oder Mausrad auf eine Galaxie zoomt hinein.';
        }
        if (L === 1) {
          ph.textContent = `Galaxie ${state.g}`;
          pb.innerHTML =
            '50 Systeme · eigene gold, andere blau · roter Punkt: Kampf in den letzten 24 h.';
        }
        if (L === 2) {
          ph.textContent = `System [${state.g}:${state.s}]`;
          pb.innerHTML =
            '15 Bahnen und der Gürtel (Position 16) · Klick auf einen Planeten zoomt hinein.';
        }
        if (L === 3) {
          ph.textContent = `[${state.g}:${state.s}:${state.p}] · Kolonie Varn`;
          pb.innerHTML =
            '<div class="kv"><span>Besitzer</span><span>Vex (Platz 3)</span><span>Mond</span><span>ja</span><span>Trümmerfeld</span><span>41.000 Adamant</span><span>Flugzeit</span><span>1:52</span></div><div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap"><button class="small">Auspex-Erkundung</button><button class="small">Sturmangriff</button><button class="small">Abbauen</button></div>';
        }
        const parts = [
          'Universum',
          `Galaxie ${state.g}`,
          `System ${state.s}`,
          `Planet ${state.p}`,
        ].slice(0, L + 1);
        document.getElementById('crumbs').innerHTML = parts
          .map(
            (p, i) =>
              `<a data-l="${i}" class="${i === L ? 'on' : ''}">${p}</a>`,
          )
          .join('<span class="sep">›</span>');
        document.getElementById('lv').innerHTML = LEVELS.map((n, i) =>
          i === L ? `<b>${n}</b>` : n,
        ).join(' · ');
      }

      let layer = null,
        busy = false;
      function render() {
        const g0 = el('g', {});
        DRAW[state.lv](g0);
        svg.innerHTML = '';
        svg.appendChild(g0);
        layer = g0;
        panel();
      }
      const ease = (t) =>
        t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
      function tween(g, from, to, ms) {
        return new Promise((done) => {
          const t0 = performance.now();
          const step = (now) => {
            const t = Math.min(1, (now - t0) / ms),
              e = ease(t);
            const k = from.k + (to.k - from.k) * e,
              x = from.x + (to.x - from.x) * e,
              y = from.y + (to.y - from.y) * e,
              o = from.o + (to.o - from.o) * e;
            g.setAttribute(
              'transform',
              `translate(${CX} ${CY}) scale(${k}) translate(${-x} ${-y})`,
            );
            g.setAttribute('opacity', o);
            t < 1 ? requestAnimationFrame(step) : done();
          };
          requestAnimationFrame(step);
        });
      }
      function targetXY(k) {
        if (state.lv === 0) return galPos(k);
        if (state.lv === 1) return sysPos(k);
        if (state.lv === 2) return orbit(k);
        return [CX, CY];
      }
      async function zoomIn(k) {
        if (busy || state.lv >= 3) return;
        busy = true;
        const [x, y] = targetXY(k);
        await tween(
          layer,
          { k: 1, x: CX, y: CY, o: 1 },
          { k: 6, x, y, o: 0 },
          650,
        );
        if (state.lv === 0) state.g = k;
        else if (state.lv === 1) state.s = k;
        else state.p = k;
        state.lv++;
        render();
        await tween(
          layer,
          { k: 0.25, x: CX, y: CY, o: 0 },
          { k: 1, x: CX, y: CY, o: 1 },
          550,
        );
        busy = false;
      }
      async function zoomOut(to = state.lv - 1) {
        if (busy || state.lv <= 0) return;
        busy = true;
        await tween(
          layer,
          { k: 1, x: CX, y: CY, o: 1 },
          { k: 0.25, x: CX, y: CY, o: 0 },
          500,
        );
        const from = state.lv;
        state.lv = to;
        render();
        const key = to === 0 ? state.g : to === 1 ? state.s : state.p;
        const [x, y] = targetXY(key);
        await tween(
          layer,
          { k: 6, x, y, o: 0 },
          { k: 1, x: CX, y: CY, o: 1 },
          600,
        );
        busy = false;
      }
      svg.addEventListener('click', (ev) => {
        const g = ev.target.closest('[data-k]');
        if (g) zoomIn(+g.dataset.k);
      });
      svg.addEventListener(
        'wheel',
        (ev) => {
          ev.preventDefault();
          if (ev.deltaY > 0) return zoomOut();
          const pt = svg.createSVGPoint();
          pt.x = ev.clientX;
          pt.y = ev.clientY;
          const p = pt.matrixTransform(svg.getScreenCTM().inverse());
          let best = null,
            bd = Infinity;
          svg.querySelectorAll('[data-k]').forEach((g) => {
            const [x, y] = targetXY(+g.dataset.k);
            const d = Math.hypot(x - p.x, y - p.y);
            if (d < bd) {
              bd = d;
              best = +g.dataset.k;
            }
          });
          if (best != null) zoomIn(best);
        },
        { passive: false },
      );
      document.getElementById('zin').onclick = () =>
        zoomIn(state.lv === 0 ? state.g : state.lv === 1 ? state.s : state.p);
      document.getElementById('zout').onclick = () => zoomOut();
      document.getElementById('crumbs').addEventListener('click', (ev) => {
        const a = ev.target.closest('a');
        if (a && +a.dataset.l < state.lv) zoomOut(+a.dataset.l);
      });
      document.addEventListener('keydown', (ev) => {
        if (ev.key === 'Escape' || ev.key === '-') zoomOut();
        if (ev.key === '+') document.getElementById('zin').click();
      });
      render();

      // Demo for the recording: ?demo=1 runs Universum → Galaxie 1 → System 27 → Planet 8 → back.
      if (location.search.includes('demo')) {
        const wait = (ms) => new Promise((r) => setTimeout(r, ms));
        (async () => {
          await wait(900);
          await zoomIn(1);
          await wait(1100);
          await zoomIn(27);
          await wait(1100);
          await zoomIn(8);
          await wait(1600);
          await zoomOut(0);
          await wait(800);
          window.demoDone = true;
        })();
      }
    </script>
  </body>
</html>
