<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>Rasse</title>
    <link rel="stylesheet" href="/style.css" />
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        background: #050405;
      }
      .r-phone {
        width: 390px;
        height: 780px;
        position: relative;
        overflow: hidden;
        border-radius: 32px;
        border: 1px solid #4a1a3a;
        background: radial-gradient(ellipse at 40% 45%, #2a0f22, #0d0710 70%);
        font-family: 'EB Garamond', Georgia, serif;
        color: #f0e0e8;
      }
      .r-top {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        padding: 30px 10px 8px;
        display: flex;
        gap: 6px;
        align-items: center;
        background: #1a0c18;
        border-bottom: 1px solid #4a1a3a;
        z-index: 3;
      }
      .r-pill {
        display: inline-flex;
        gap: 5px;
        align-items: center;
        border: 1px solid #4a1a3a;
        border-radius: 4px;
        padding: 3px 10px;
        font-size: 13px;
        background: #2a1226;
        clip-path: polygon(
          0 10px,
          10px 0,
          calc(100% - 10px) 0,
          100% 10px,
          100% 100%,
          0 100%
        );
      }
      .r-pill img {
        width: 15px;
        height: 15px;
        filter: hue-rotate(250deg) saturate(1.4);
      }
      .r-sheet {
        position: absolute;
        left: 4px;
        right: 4px;
        top: 642px;
        bottom: 64px;
        background: #1a0c18;
        border: 1.5px solid #b6e04a;
        border-radius: 4px;
        padding: 6px 12px;
        z-index: 3;
        clip-path: polygon(
          0 10px,
          10px 0,
          calc(100% - 10px) 0,
          100% 10px,
          100% 100%,
          0 100%
        );
      }
      .r-grip {
        width: 40px;
        height: 4px;
        border-radius: 2px;
        background: #b6e04a;
        opacity: 0.6;
        margin: 0 auto 6px;
      }
      .r-row {
        display: flex;
        gap: 6px;
        align-items: center;
        font-size: 12px;
        white-space: nowrap;
        overflow: hidden;
      }
      .r-row b {
        color: #b6e04a;
        letter-spacing: 0.02em;
      }
      .r-tag {
        border: 1px solid;
        border-radius: 4px;
        padding: 1px 6px;
        font-size: 10.5px;
        letter-spacing: 0.04em;
      }
      .r-tabs {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 62px;
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        background: #1a0c18;
        border-top: 1px solid #4a1a3a;
        z-index: 3;
      }
      .r-tab {
        display: grid;
        place-items: center;
        font-size: 11.5px;
        color: #b090a8;
        letter-spacing: 0.02em;
      }
      .r-tab.on {
        color: #b6e04a;
        background: #2a1226;
        border-radius: 4px;
        margin: 8px 4px;
      }
      .r-name {
        position: absolute;
        left: 12px;
        top: 104px;
        z-index: 2;
        font-size: 11.5px;
        color: #b090a8;
        letter-spacing: 0.02em;
      }
      @keyframes breathe {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.012);
        }
      }
      @keyframes seam {
        0%,
        100% {
          border-color: #5a3a18;
        }
        50% {
          border-color: #e0a640;
        }
      }
      .r-sheet {
        animation:
          breathe 1.5s ease-in-out infinite,
          seam 1.5s infinite;
      }
      .r-pill {
        animation: seam 1.5s infinite;
      }
    </style>
  </head>
