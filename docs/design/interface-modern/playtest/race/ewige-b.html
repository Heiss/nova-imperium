<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>Rasse</title>
    <link rel="stylesheet" href="/style.css" />
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        background: #050405;
      }
      .r-phone {
        width: 390px;
        height: 780px;
        position: relative;
        overflow: hidden;
        border-radius: 32px;
        border: 1px solid #2a3a4a;
        background: linear-gradient(#0b1220, #05080e);
        font-family: 'DejaVu Sans', 'Segoe UI', sans-serif;
        color: #dce6f0;
      }
      .r-top {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        padding: 30px 10px 8px;
        display: flex;
        gap: 6px;
        align-items: center;
        background: #0d141c;
        border-bottom: 1px solid #2a3a4a;
        z-index: 3;
      }
      .r-pill {
        display: inline-flex;
        gap: 5px;
        align-items: center;
        border: 1px solid #2a3a4a;
        border-radius: 14px;
        padding: 3px 10px;
        font-size: 13px;
        background: #141e2a;
        clip-path: none;
      }
      .r-pill img {
        width: 15px;
        height: 15px;
        filter: grayscale(1) brightness(1.4);
      }
      .r-sheet {
        position: absolute;
        left: 4px;
        right: 4px;
        top: 642px;
        bottom: 64px;
        background: #0d141c;
        border: 1.5px solid #7fe0f0;
        border-radius: 14px;
        padding: 6px 12px;
        z-index: 3;
        clip-path: none;
      }
      .r-grip {
        width: 40px;
        height: 4px;
        border-radius: 2px;
        background: #7fe0f0;
        opacity: 0.6;
        margin: 0 auto 6px;
      }
      .r-row {
        display: flex;
        gap: 6px;
        align-items: center;
        font-size: 12px;
        white-space: nowrap;
        overflow: hidden;
      }
      .r-row b {
        color: #7fe0f0;
        letter-spacing: 0.14em;
      }
      .r-tag {
        border: 1px solid;
        border-radius: 14px;
        padding: 1px 6px;
        font-size: 10.5px;
        letter-spacing: 0.04em;
      }
      .r-tabs {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 62px;
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        background: #0d141c;
        border-top: 1px solid #2a3a4a;
        z-index: 3;
      }
      .r-tab {
        display: grid;
        place-items: center;
        font-size: 11.5px;
        color: #7f93a8;
        letter-spacing: 0.14em;
      }
      .r-tab.on {
        color: #7fe0f0;
        background: #141e2a;
        border-radius: 14px;
        margin: 8px 4px;
      }
      .r-name {
        position: absolute;
        left: 12px;
        top: 104px;
        z-index: 2;
        font-size: 11.5px;
        color: #7f93a8;
        letter-spacing: 0.14em;
      }
      @keyframes tick {
        to {
          background-position: 60px 0;
        }
      }
      .r-sheet {
        background-image: repeating-linear-gradient(
          90deg,
          transparent 0 10px,
          rgb(201 210 220 / 0.08) 10px 12px
        );
        animation: tick 1.5s steps(6) infinite;
      }
    </style>
  </head>
