<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>Rasse</title>
    <link rel="stylesheet" href="/style.css" />
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        background: #050405;
      }
      .r-phone {
        width: 390px;
        height: 780px;
        position: relative;
        overflow: hidden;
        border-radius: 32px;
        border: 1px solid #4a1a3a;
        background: radial-gradient(ellipse at 40% 45%, #2a0f22, #0d0710 70%);
        font-family: 'EB Garamond', Georgia, serif;
        color: #f0e0e8;
      }
      .r-top {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        padding: 30px 10px 8px;
        display: flex;
        gap: 6px;
        align-items: center;
        background: #1a0c18;
        border-bottom: 1px solid #4a1a3a;
        z-index: 3;
      }
      .r-pill {
        display: inline-flex;
        gap: 5px;
        align-items: center;
        border: 1px solid #4a1a3a;
        border-radius: 28px 22px 30px 18px;
        padding: 3px 10px;
        font-size: 13px;
        background: #2a1226;
        clip-path: none;
      }
      .r-pill img {
        width: 15px;
        height: 15px;
        filter: hue-rotate(250deg) saturate(1.4);
      }
      .r-sheet {
        position: absolute;
        left: 4px;
        right: 4px;
        top: 642px;
        bottom: 64px;
        background: #1a0c18;
        border: 1.5px solid #b6e04a;
        border-radius: 28px 22px 30px 18px;
        padding: 6px 12px;
        z-index: 3;
        clip-path: none;
      }
      .r-grip {
        width: 40px;
        height: 4px;
        border-radius: 2px;
        background: #b6e04a;
        opacity: 0.6;
        margin: 0 auto 6px;
      }
      .r-row {
        display: flex;
        gap: 6px;
        align-items: center;
        font-size: 12px;
        white-space: nowrap;
        overflow: hidden;
      }
      .r-row b {
        color: #b6e04a;
        letter-spacing: 0.02em;
      }
      .r-tag {
        border: 1px solid;
        border-radius: 28px 22px 30px 18px;
        padding: 1px 6px;
        font-size: 10.5px;
        letter-spacing: 0.04em;
      }
      .r-tabs {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 62px;
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        background: #1a0c18;
        border-top: 1px solid #4a1a3a;
        z-index: 3;
      }
      .r-tab {
        display: grid;
        place-items: center;
        font-size: 11.5px;
        color: #b090a8;
        letter-spacing: 0.02em;
      }
      .r-tab.on {
        color: #b6e04a;
        background: #2a1226;
        border-radius: 28px 22px 30px 18px;
        margin: 8px 4px;
      }
      .r-name {
        position: absolute;
        left: 12px;
        top: 104px;
        z-index: 2;
        font-size: 11.5px;
        color: #b090a8;
        letter-spacing: 0.02em;
      }
      @keyframes morph {
        0% {
          border-radius: 30px 18px 34px 20px / 22px 30px 18px 28px;
        }
        50% {
          border-radius: 18px 34px 20px 30px / 30px 18px 28px 22px;
        }
        100% {
          border-radius: 30px 18px 34px 20px / 22px 30px 18px 28px;
        }
      }
      @keyframes beat {
        0%,
        100% {
          box-shadow: 0 0 14px rgb(182 224 74 / 0.25);
        }
        40% {
          box-shadow: 0 0 30px rgb(182 224 74 / 0.55);
        }
      }
      .r-sheet,
      .r-pill,
      .r-tag {
        animation: morph 1.5s ease-in-out infinite;
      }
      .r-sheet {
        animation:
          morph 1.5s ease-in-out infinite,
          beat 1.5s ease-in-out infinite;
      }
      .r-tab.on {
        animation: morph 1.5s infinite;
      }
    </style>
  </head>
