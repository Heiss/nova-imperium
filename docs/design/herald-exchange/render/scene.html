<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        margin: 0;
        background: #000;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <canvas id="out" width="1280" height="536"></canvas>
    <script type="importmap">
      { "imports": { "three": "./node_modules/three/build/three.module.js" } }
    </script>
    <script type="module">
      import * as THREE from 'three';

      const W = 1280,
        H = 536;
      const shot = new URLSearchParams(location.search).get('shot') || '1';

      // Deterministic random so the stills are reproducible.
      let seed = 7 + Number(shot) * 101;
      const rnd = () => {
        seed = (seed * 1664525 + 1013904223) % 4294967296;
        return seed / 4294967296;
      };
      const rr = (a, b) => a + (b - a) * rnd();

      const renderer = new THREE.WebGLRenderer({
        antialias: true,
        preserveDrawingBuffer: true,
      });
      renderer.setSize(W, H);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.15;
      renderer.outputColorSpace = THREE.SRGBColorSpace;

      const scene = new THREE.Scene();

      // ---------- textures ----------
      function canvasTex(w, h, draw) {
        const c = document.createElement('canvas');
        c.width = w;
        c.height = h;
        draw(c.getContext('2d'), w, h);
        const t = new THREE.CanvasTexture(c);
        t.colorSpace = THREE.SRGBColorSpace;
        return t;
      }
      const glowTex = (inner, outer) =>
        canvasTex(128, 128, (g, w, h) => {
          const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
          gr.addColorStop(0, inner);
          gr.addColorStop(0.25, outer);
          gr.addColorStop(1, 'rgba(0,0,0,0)');
          g.fillStyle = gr;
          g.fillRect(0, 0, w, h);
        });
      const fireTex = glowTex('rgba(255,250,220,1)', 'rgba(255,140,40,0.75)');
      const blueTex = glowTex('rgba(230,250,255,1)', 'rgba(90,170,255,0.6)');
      const redTex = glowTex('rgba(255,230,220,1)', 'rgba(255,70,40,0.7)');
      const smokeTex = glowTex('rgba(80,60,50,0.55)', 'rgba(40,30,25,0.35)');

      // Nebula sky
      const sky = canvasTex(2048, 1024, (g, w, h) => {
        g.fillStyle = '#020306';
        g.fillRect(0, 0, w, h);
        const blobs = [
          ['rgba(150,60,30,0.10)', 0.3, 0.45, 520],
          ['rgba(40,70,140,0.12)', 0.62, 0.4, 600],
          ['rgba(120,40,90,0.08)', 0.8, 0.62, 420],
          ['rgba(200,120,50,0.07)', 0.15, 0.62, 380],
          ['rgba(60,110,160,0.08)', 0.45, 0.25, 500],
        ];
        for (const [c, x, y, r] of blobs)
          for (let i = 0; i < 9; i++) {
            const cx = (x + rr(-0.06, 0.06)) * w,
              cy = (y + rr(-0.08, 0.08)) * h,
              rad = r * rr(0.4, 1);
            const gr = g.createRadialGradient(cx, cy, 0, cx, cy, rad);
            gr.addColorStop(0, c);
            gr.addColorStop(1, 'rgba(0,0,0,0)');
            g.fillStyle = gr;
            g.fillRect(0, 0, w, h);
          }
        for (let i = 0; i < 5000; i++) {
          const b = rnd() ** 4;
          g.fillStyle = `rgba(255,${230 + rr(0, 25)},${200 + rr(0, 55)},${0.2 + b * 0.8})`;
          const s = b > 0.8 ? 2 : 1;
          g.fillRect(rnd() * w, rnd() * h, s, s);
        }
      });
      const skyMesh = new THREE.Mesh(
        new THREE.SphereGeometry(900, 48, 24),
        new THREE.MeshBasicMaterial({ map: sky, side: THREE.BackSide }),
      );
      scene.add(skyMesh);

      // Planet
      const planetTex = canvasTex(1024, 512, (g, w, h) => {
        g.fillStyle = '#5a4630';
        g.fillRect(0, 0, w, h);
        for (let i = 0; i < 260; i++) {
          const y = rnd() * h;
          g.fillStyle = `rgba(${rr(60, 190)},${rr(50, 130)},${rr(30, 80)},${rr(0.05, 0.25)})`;
          g.fillRect(0, y, w, rr(2, 26));
        }
        for (let i = 0; i < 140; i++) {
          g.fillStyle = `rgba(${rr(20, 60)},${rr(20, 40)},${rr(10, 30)},0.3)`;
          g.beginPath();
          g.ellipse(rnd() * w, rnd() * h, rr(10, 80), rr(5, 30), 0, 0, 7);
          g.fill();
        }
      });
      function addPlanet(pos, radius) {
        const p = new THREE.Mesh(
          new THREE.SphereGeometry(radius, 96, 48),
          new THREE.MeshStandardMaterial({ map: planetTex, roughness: 0.95 }),
        );
        p.position.copy(pos);
        p.rotation.z = 0.3;
        scene.add(p);
        const atmo = new THREE.Mesh(
          new THREE.SphereGeometry(radius * 1.025, 96, 48),
          new THREE.MeshBasicMaterial({
            color: 0xffa860,
            transparent: true,
            opacity: 0.1,
            blending: THREE.AdditiveBlending,
            side: THREE.BackSide,
          }),
        );
        atmo.position.copy(pos);
        scene.add(atmo);
        return p;
      }

      // ---------- lights ----------
      scene.add(new THREE.AmbientLight(0x30343c, 0.6));
      const sun = new THREE.DirectionalLight(0xfff0d8, 3.2);
      sun.position.set(-300, 120, 200);
      scene.add(sun);
      const rim = new THREE.DirectionalLight(0xff7a30, 1.4);
      rim.position.set(200, -40, -300);
      scene.add(rim);

      // ---------- ships ----------
      const hullMat = new THREE.MeshStandardMaterial({
        color: 0x5a5048,
        metalness: 0.75,
        roughness: 0.45,
      });
      const goldMat = new THREE.MeshStandardMaterial({
        color: 0xb08a3a,
        metalness: 0.9,
        roughness: 0.35,
      });
      const darkMat = new THREE.MeshStandardMaterial({
        color: 0x2a2622,
        metalness: 0.6,
        roughness: 0.6,
      });
      const engineMat = new THREE.MeshBasicMaterial({ color: 0x9fd8ff });
      const redHull = new THREE.MeshStandardMaterial({
        color: 0x4a3a36,
        metalness: 0.7,
        roughness: 0.5,
      });

      function sprite(tex, size, pos, opacity = 1) {
        const s = new THREE.Sprite(
          new THREE.SpriteMaterial({
            map: tex,
            blending: THREE.AdditiveBlending,
            transparent: true,
            opacity,
            depthWrite: false,
          }),
        );
        s.scale.set(size, size, 1);
        s.position.copy(pos);
        scene.add(s);
        return s;
      }

      // Kathedralschiff: long hull, prow, spires, engine bank. Length about 40 units along +x.
      function cathedral(mat = hullMat) {
        const g = new THREE.Group();
        const hull = new THREE.Mesh(new THREE.BoxGeometry(30, 4.5, 7), mat);
        g.add(hull);
        const keel = new THREE.Mesh(new THREE.BoxGeometry(26, 2.5, 4), darkMat);
        keel.position.set(-1, -3, 0);
        g.add(keel);
        const prow = new THREE.Mesh(new THREE.ConeGeometry(3.6, 12, 4), mat);
        prow.rotation.z = -Math.PI / 2;
        prow.rotation.x = Math.PI / 4;
        prow.position.x = 21;
        g.add(prow);
        const ram = new THREE.Mesh(new THREE.BoxGeometry(6, 1, 1), goldMat);
        ram.position.set(25, -1.2, 0);
        g.add(ram);
        for (let i = 0; i < 6; i++) {
          const h = i === 2 ? 13 : rr(4, 8);
          const sp = new THREE.Mesh(
            new THREE.ConeGeometry(i === 2 ? 1.6 : 0.9, h, 6),
            i === 2 ? goldMat : mat,
          );
          sp.position.set(-10 + i * 3.6, 2.2 + h / 2, rr(-1.2, 1.2));
          g.add(sp);
        }
        const tower = new THREE.Mesh(new THREE.BoxGeometry(6, 5, 4.5), mat);
        tower.position.set(-8, 4, 0);
        g.add(tower);
        for (const z of [-3.2, 3.2])
          for (let i = 0; i < 5; i++) {
            const gun = new THREE.Mesh(
              new THREE.BoxGeometry(1.6, 1, 1.2),
              goldMat,
            );
            gun.position.set(-6 + i * 4.4, 0.6, z * 1.2);
            g.add(gun);
            const barrel = new THREE.Mesh(
              new THREE.CylinderGeometry(0.15, 0.15, 2.4),
              darkMat,
            );
            barrel.rotation.x = Math.PI / 2;
            barrel.position.set(
              -6 + i * 4.4,
              0.8,
              z * 1.2 + Math.sign(z) * 1.4,
            );
            g.add(barrel);
          }
        for (const [y, z] of [
          [0.8, -2],
          [0.8, 2],
          [-1.6, 0],
          [-1.6, -2.6],
          [-1.6, 2.6],
        ]) {
          const e = new THREE.Mesh(
            new THREE.CylinderGeometry(1.1, 1.1, 0.6, 16),
            engineMat,
          );
          e.rotation.z = Math.PI / 2;
          e.position.set(-15.2, y, z);
          g.add(e);
        }
        g.userData.engines = [
          [-16, 0.8, -2],
          [-16, 0.8, 2],
          [-16, -1.6, 0],
        ];
        return g;
      }
      function frigate(mat = hullMat) {
        const g = new THREE.Group();
        const hull = new THREE.Mesh(new THREE.BoxGeometry(9, 1.8, 3), mat);
        g.add(hull);
        const prow = new THREE.Mesh(new THREE.ConeGeometry(1.6, 5, 4), mat);
        prow.rotation.z = -Math.PI / 2;
        prow.rotation.x = Math.PI / 4;
        prow.position.x = 7;
        g.add(prow);
        const sp = new THREE.Mesh(new THREE.ConeGeometry(0.6, 4, 6), goldMat);
        sp.position.set(-1, 2.5, 0);
        g.add(sp);
        const e = new THREE.Mesh(
          new THREE.CylinderGeometry(0.8, 0.8, 0.4, 12),
          engineMat,
        );
        e.rotation.z = Math.PI / 2;
        e.position.x = -4.6;
        g.add(e);
        g.userData.engines = [[-5, 0, 0]];
        return g;
      }
      function place(obj, pos, yaw = 0, pitch = 0, roll = 0, s = 1) {
        obj.position.copy(pos);
        obj.rotation.set(roll, yaw, pitch);
        obj.scale.setScalar(s);
        scene.add(obj);
        if (obj.userData.engines)
          for (const e of obj.userData.engines) {
            const p = new THREE.Vector3(...e)
              .multiplyScalar(s)
              .applyEuler(obj.rotation)
              .add(pos);
            sprite(blueTex, 5 * s, p, 0.9);
          }
        return obj;
      }
      function fighters(n, center, spread, dir, color = 0x8a8078, size = 0.5) {
        const geo = new THREE.ConeGeometry(0.5 * size, 2.2 * size, 3);
        geo.rotateZ(-Math.PI / 2);
        const m = new THREE.InstancedMesh(
          geo,
          new THREE.MeshStandardMaterial({
            color,
            metalness: 0.6,
            roughness: 0.5,
          }),
          n,
        );
        const d = new THREE.Object3D();
        for (let i = 0; i < n; i++) {
          d.position.set(
            center.x + rr(-spread.x, spread.x),
            center.y + rr(-spread.y, spread.y),
            center.z + rr(-spread.z, spread.z),
          );
          d.rotation.set(rr(-0.2, 0.2), dir + rr(-0.15, 0.15), rr(-0.2, 0.2));
          d.updateMatrix();
          m.setMatrixAt(i, d.matrix);
          if (rnd() < 0.6) {
            const back = new THREE.Vector3(-1.2 * size, 0, 0)
              .applyEuler(d.rotation)
              .add(d.position);
            sprite(blueTex, 0.9 * size + rr(0, 0.6), back, 0.7);
          }
        }
        scene.add(m);
        return m;
      }

      // ---------- weapons and effects ----------
      function beam(a, b, color = 0xff6a3a, width = 0.25, glow = true) {
        const dir = new THREE.Vector3().subVectors(b, a);
        const len = dir.length();
        const core = new THREE.Mesh(
          new THREE.CylinderGeometry(width * 0.4, width * 0.4, len, 6),
          new THREE.MeshBasicMaterial({
            color: 0xffffff,
            transparent: true,
            opacity: 0.95,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
          }),
        );
        const halo = new THREE.Mesh(
          new THREE.CylinderGeometry(width * 1.6, width * 1.6, len, 8),
          new THREE.MeshBasicMaterial({
            color,
            transparent: true,
            opacity: 0.45,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
          }),
        );
        for (const m of [core, halo]) {
          m.position.copy(a).addScaledVector(dir, 0.5);
          m.quaternion.setFromUnitVectors(
            new THREE.Vector3(0, 1, 0),
            dir.clone().normalize(),
          );
          scene.add(m);
        }
        if (glow)
          sprite(color === 0x6ab8ff ? blueTex : redTex, width * 22, b, 0.9);
      }
      function tracers(from, spreadFrom, to, spreadTo, n, color, len = 6) {
        for (let i = 0; i < n; i++) {
          const a = from
            .clone()
            .add(
              new THREE.Vector3(
                rr(-1, 1) * spreadFrom,
                rr(-1, 1) * spreadFrom,
                rr(-1, 1) * spreadFrom,
              ),
            );
          const b = to
            .clone()
            .add(
              new THREE.Vector3(
                rr(-1, 1) * spreadTo,
                rr(-1, 1) * spreadTo,
                rr(-1, 1) * spreadTo,
              ),
            );
          const t = rnd();
          const p = a.clone().lerp(b, t);
          const q = a.clone().lerp(b, Math.min(1, t + len / a.distanceTo(b)));
          beam(p, q, color, 0.08, false);
        }
      }
      function explosion(pos, size, debris = 30) {
        sprite(smokeTex, size * 2.2, pos, 0.9);
        for (let i = 0; i < 9; i++)
          sprite(
            fireTex,
            size * rr(0.4, 1.1),
            pos
              .clone()
              .add(
                new THREE.Vector3(
                  rr(-1, 1),
                  rr(-1, 1),
                  rr(-1, 1),
                ).multiplyScalar(size * 0.35),
              ),
            rr(0.6, 1),
          );
        sprite(fireTex, size * 3, pos, 0.35);
        const light = new THREE.PointLight(0xff9040, size * 60, size * 12);
        light.position.copy(pos);
        scene.add(light);
        for (let i = 0; i < debris; i++) {
          const c = new THREE.Mesh(
            new THREE.BoxGeometry(rr(0.2, 1), rr(0.1, 0.5), rr(0.2, 1.2)).scale(
              size / 10,
              size / 10,
              size / 10,
            ),
            darkMat,
          );
          c.position
            .copy(pos)
            .add(
              new THREE.Vector3(rr(-1, 1), rr(-1, 1), rr(-1, 1))
                .normalize()
                .multiplyScalar(size * rr(0.5, 1.6)),
            );
          c.rotation.set(rr(0, 6), rr(0, 6), rr(0, 6));
          scene.add(c);
          if (rnd() < 0.4) sprite(fireTex, size * 0.12, c.position, 0.9);
        }
      }
      function shieldHit(center, radius, at) {
        const s = new THREE.Mesh(
          new THREE.SphereGeometry(radius, 48, 24),
          new THREE.MeshBasicMaterial({
            color: 0x5aa8ff,
            transparent: true,
            opacity: 0.07,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
          }),
        );
        s.position.copy(center);
        scene.add(s);
        sprite(blueTex, radius * 0.45, at, 1);
        sprite(blueTex, radius * 1.0, at, 0.3);
      }

      // ---------- the shots ----------
      const cam = new THREE.PerspectiveCamera(40, W / H, 0.1, 3000);
      let shake = 0,
        blur = 0,
        grade = 'teal';

      function attackerFleet(origin) {
        const ships = [];
        for (let i = 0; i < 7; i++)
          ships.push(
            place(
              cathedral(),
              origin
                .clone()
                .add(
                  new THREE.Vector3(
                    rr(-40, 40),
                    rr(-18, 18),
                    -i * 34 + rr(-6, 6),
                  ),
                ),
              0.05,
              rr(-0.03, 0.03),
              rr(-0.05, 0.05),
            ),
          );
        for (let i = 0; i < 22; i++)
          place(
            frigate(),
            origin
              .clone()
              .add(
                new THREE.Vector3(rr(-70, 70) + 40, rr(-30, 30), rr(-240, 40)),
              ),
            0.05,
            0,
            rr(-0.1, 0.1),
          );
        return ships;
      }

      if (shot === '1') {
        // Establishing: the attacker drops out of the warp in front of the planet.
        addPlanet(new THREE.Vector3(260, -60, -420), 230);
        const ships = attackerFleet(new THREE.Vector3(-40, 10, 0));
        for (let i = 0; i < 40; i++) {
          // warp streaks
          const a = new THREE.Vector3(rr(-140, 60), rr(-40, 50), rr(-300, 60));
          beam(
            a,
            a.clone().add(new THREE.Vector3(-rr(40, 160), 0, 0)),
            0x6ab8ff,
            rr(0.05, 0.25),
            false,
          );
        }
        fighters(
          260,
          new THREE.Vector3(20, -10, -60),
          new THREE.Vector3(60, 20, 120),
          0,
          0x8a8078,
          0.8,
        );
        cam.position.set(-150, 30, 120);
        cam.lookAt(80, -10, -160);
        cam.fov = 38;
        shake = 0.2;
        grade = 'teal';
      }
      if (shot === '2') {
        // Long lens on the defender line, first volley (round 1).
        addPlanet(new THREE.Vector3(-30, -330, -200), 300);
        const z0 = -40;
        for (let i = 0; i < 6; i++)
          place(
            cathedral(redHull),
            new THREE.Vector3(-60 + i * 26, -8 + rr(-4, 4), z0 - i * 16),
            Math.PI - 0.25,
            0,
            0.05,
          );
        for (let i = 0; i < 12; i++) {
          const from = new THREE.Vector3(260, rr(-10, 30), 200 + rr(-40, 40));
          const to = new THREE.Vector3(
            -60 + rr(0, 140),
            rr(-10, 6),
            z0 - rr(0, 80),
          );
          beam(from.clone().lerp(to, 0.55), to, 0xff6a3a, 0.35);
        }
        shieldHit(
          new THREE.Vector3(-8, -6, z0 - 32),
          16,
          new THREE.Vector3(4, -2, z0 - 22),
        );
        tracers(
          new THREE.Vector3(-20, -4, z0 - 40),
          40,
          new THREE.Vector3(300, 20, 300),
          60,
          60,
          0x6ab8ff,
          14,
        );
        cam.position.set(140, 10, 160);
        cam.lookAt(-10, -4, z0 - 40);
        cam.fov = 13; // telephoto
        shake = 0.25;
        blur = 0.06;
        grade = 'orange';
      }
      if (shot === '3') {
        // Fighters dive through the flak (round 2), camera rides along.
        addPlanet(new THREE.Vector3(0, -420, -300), 380);
        fighters(
          70,
          new THREE.Vector3(6, -2, -30),
          new THREE.Vector3(16, 7, 34),
          Math.PI / 2,
          0xc8b8a0,
          2.4,
        );
        place(
          cathedral(redHull),
          new THREE.Vector3(30, -30, -170),
          2.4,
          0.1,
          0.2,
          1.4,
        );
        for (let i = 0; i < 26; i++) {
          // flak bursts
          sprite(
            fireTex,
            rr(2, 6),
            new THREE.Vector3(rr(-60, 60), rr(-25, 30), rr(-160, -20)),
            rr(0.5, 1),
          );
          sprite(
            smokeTex,
            rr(4, 9),
            new THREE.Vector3(rr(-60, 60), rr(-25, 30), rr(-160, -20)),
            0.6,
          );
        }
        tracers(
          new THREE.Vector3(30, -30, -170),
          20,
          new THREE.Vector3(0, 0, 0),
          40,
          140,
          0xff9a40,
          10,
        );
        explosion(new THREE.Vector3(-8, 4, -40), 5, 12);
        cam.position.set(4, 6, 30);
        cam.lookAt(10, -12, -150);
        cam.fov = 62;
        cam.rotation.z += 0.18;
        shake = 1.0;
        blur = 0.35;
        grade = 'orange';
      }
      if (shot === '4') {
        // Close on a Kathedralschiff: its shield flares, then breaks (round 3).
        const ship = place(
          cathedral(),
          new THREE.Vector3(0, 0, 0),
          -0.6,
          0.05,
          0.12,
        );
        shieldHit(new THREE.Vector3(2, 1, 0), 28, new THREE.Vector3(10, 4, 12));
        for (let i = 0; i < 5; i++)
          beam(
            new THREE.Vector3(200, 40 + i * 6, 120 - i * 20),
            new THREE.Vector3(10 + rr(-2, 2), 4 + rr(-2, 2), 12 + rr(-2, 2)),
            0xff6a3a,
            0.22,
          );
        explosion(new THREE.Vector3(-4, 3.5, 5), 2.5, 14);
        tracers(
          new THREE.Vector3(0, 2, 0),
          10,
          new THREE.Vector3(300, 60, 140),
          60,
          50,
          0x6ab8ff,
          16,
        );
        addPlanet(new THREE.Vector3(-200, -120, -500), 200);
        cam.position.set(46, 14, 58);
        cam.lookAt(-2, 2, 0);
        cam.fov = 36;
        shake = 0.6;
        blur = 0.25;
        grade = 'teal';
      }
      if (shot === '5') {
        // A Kathedralschiff breaks apart (round 4). Slow motion, muffled sound.
        addPlanet(new THREE.Vector3(160, -160, -480), 260);
        const p = new THREE.Vector3(0, 0, -60);
        const front = cathedral(redHull);
        place(
          front,
          p.clone().add(new THREE.Vector3(14, 3, 0)),
          Math.PI - 0.3,
          0.15,
          0.25,
        );
        explosion(p, 26, 90);
        explosion(p.clone().add(new THREE.Vector3(-14, -4, 4)), 12, 30);
        for (let i = 0; i < 4; i++)
          place(
            frigate(),
            new THREE.Vector3(rr(-90, -40), rr(-10, 20), rr(-160, -40)),
            0.4,
            0,
            0.2,
          );
        cam.position.set(-30, 10, 60);
        cam.lookAt(0, 0, -60);
        cam.fov = 44;
        shake = 0.15;
        blur = 0.2;
        grade = 'bleach';
      }
      if (shot === '6') {
        // From the planet surface: the Massebeschleuniger fire up (round 5).
        const planet = addPlanet(new THREE.Vector3(0, -1000, 0), 1000);
        for (let i = 0; i < 7; i++) {
          const base = new THREE.Vector3(-60 + i * 22, -2, -40 - (i % 3) * 30);
          const tw = new THREE.Mesh(new THREE.BoxGeometry(6, 10, 6), darkMat);
          tw.position.copy(base).add(new THREE.Vector3(0, 3, 0));
          scene.add(tw);
          const br = new THREE.Mesh(
            new THREE.CylinderGeometry(0.8, 1.1, 26, 10),
            goldMat,
          );
          br.position.copy(base).add(new THREE.Vector3(4, 14, 0));
          br.rotation.z = -0.45;
          scene.add(br);
          beam(
            base.clone().add(new THREE.Vector3(10, 26, 0)),
            new THREE.Vector3(
              260 + rr(-40, 40),
              420 + rr(-40, 40),
              -300 + rr(-80, 80),
            ),
            0x6ab8ff,
            0.6,
          );
          sprite(
            blueTex,
            18,
            base.clone().add(new THREE.Vector3(10, 26, 0)),
            1,
          );
        }
        const dome = new THREE.Mesh(
          new THREE.SphereGeometry(120, 48, 24, 0, Math.PI * 2, 0, Math.PI / 2),
          new THREE.MeshBasicMaterial({
            color: 0x5aa8ff,
            transparent: true,
            opacity: 0.08,
            blending: THREE.AdditiveBlending,
            side: THREE.DoubleSide,
            depthWrite: false,
          }),
        );
        dome.position.set(0, -2, -60);
        scene.add(dome);
        for (let i = 0; i < 9; i++)
          place(
            cathedral(),
            new THREE.Vector3(
              200 + rr(-80, 80),
              380 + rr(-60, 60),
              -320 + rr(-80, 80),
            ),
            2.6,
            -0.4,
            0.2,
          );
        explosion(new THREE.Vector3(250, 400, -280), 30, 20);
        cam.position.set(-70, 4, 40);
        cam.lookAt(80, 160, -220);
        cam.fov = 50;
        shake = 0.5;
        blur = 0.3;
        grade = 'teal';
      }
      if (shot === '7') {
        // Aftermath: the debris field, the survivors leave (end of round 6).
        addPlanet(new THREE.Vector3(120, -80, -520), 240);
        for (let i = 0; i < 260; i++) {
          const c = new THREE.Mesh(
            new THREE.BoxGeometry(rr(0.3, 4), rr(0.2, 1.4), rr(0.3, 5)),
            rnd() < 0.3 ? goldMat : darkMat,
          );
          c.position.set(rr(-120, 120), rr(-30, 30), rr(-260, 40));
          c.rotation.set(rr(0, 6), rr(0, 6), rr(0, 6));
          scene.add(c);
          if (rnd() < 0.08) sprite(fireTex, rr(0.6, 2), c.position, 0.7);
        }
        for (let i = 0; i < 6; i++)
          sprite(
            smokeTex,
            rr(20, 50),
            new THREE.Vector3(rr(-120, 120), rr(-20, 20), rr(-260, 0)),
            0.35,
          );
        const half = cathedral(redHull);
        place(half, new THREE.Vector3(-20, -6, -40), 0.9, 0.5, 1.1);
        for (let i = 0; i < 3; i++)
          place(
            cathedral(),
            new THREE.Vector3(60 + i * 30, 20 + i * 4, -200 - i * 20),
            0.25,
            0.05,
            0,
          );
        cam.position.set(-60, 4, 60);
        cam.lookAt(40, 4, -160);
        cam.fov = 40;
        shake = 0;
        blur = 0;
        grade = 'cold';
      }

      function defenseLine(t, broken) {
        // Massebeschleuniger towers on the surface, under a Schutzdom. `broken` lists the ones destroyed.
        const towers = [];
        for (let i = 0; i < 7; i++) {
          const base = new THREE.Vector3(-60 + i * 22, -2, -40 - (i % 3) * 30);
          towers.push(base);
          if (broken.includes(i)) {
            const stump = new THREE.Mesh(
              new THREE.BoxGeometry(6, 3, 6),
              darkMat,
            );
            stump.position.copy(base).add(new THREE.Vector3(0, 0.5, 0));
            stump.rotation.y = 0.4;
            scene.add(stump);
            const bar = new THREE.Mesh(
              new THREE.CylinderGeometry(0.8, 1.1, 14, 10),
              goldMat,
            );
            bar.position.copy(base).add(new THREE.Vector3(-6, 1, 4));
            bar.rotation.set(1.3, 0.3, 1.2);
            scene.add(bar);
            sprite(
              fireTex,
              8,
              base.clone().add(new THREE.Vector3(0, 2, 0)),
              0.8,
            );
            sprite(
              smokeTex,
              22,
              base.clone().add(new THREE.Vector3(2, 10, 0)),
              0.7,
            );
            continue;
          }
          const tw = new THREE.Mesh(new THREE.BoxGeometry(6, 10, 6), darkMat);
          tw.position.copy(base).add(new THREE.Vector3(0, 3, 0));
          scene.add(tw);
          const br = new THREE.Mesh(
            new THREE.CylinderGeometry(0.8, 1.1, 26, 10),
            goldMat,
          );
          br.position.copy(base).add(new THREE.Vector3(4, 14, 0));
          br.rotation.z = -0.45;
          scene.add(br);
        }
        return towers;
      }
      function orbitalStrike(target, n, spread, len = 520) {
        for (let i = 0; i < n; i++) {
          const hit = target
            .clone()
            .add(
              new THREE.Vector3(rr(-spread, spread), 0, rr(-spread, spread)),
            );
          beam(
            new THREE.Vector3(hit.x + 160, len, hit.z - 220),
            hit,
            0xff6a3a,
            0.5,
          );
        }
      }
      if (shot === '8') {
        // Defense destroyed (round 4): orbital fire breaks the Schutzdom, a Massebeschleuniger explodes.
        addPlanet(new THREE.Vector3(0, -1000, 0), 1000);
        const towers = defenseLine(0, [1, 4]);
        const dome = new THREE.Mesh(
          new THREE.SphereGeometry(120, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2),
          new THREE.MeshBasicMaterial({
            color: 0x5aa8ff,
            transparent: true,
            opacity: 0.05,
            blending: THREE.AdditiveBlending,
            side: THREE.DoubleSide,
            depthWrite: false,
          }),
        );
        dome.position.set(0, -2, -60);
        scene.add(dome);
        const cracks = new THREE.Mesh(
          new THREE.SphereGeometry(120.5, 14, 7, 0.4, 1.6, 0.2, 1.2),
          new THREE.MeshBasicMaterial({
            color: 0xbfe4ff,
            wireframe: true,
            transparent: true,
            opacity: 0.18,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
          }),
        );
        cracks.position.copy(dome.position);
        scene.add(cracks);
        orbitalStrike(towers[3], 5, 4);
        explosion(towers[3].clone().add(new THREE.Vector3(0, 8, 0)), 16, 60);
        sprite(
          fireTex,
          30,
          towers[3].clone().add(new THREE.Vector3(0, 22, 0)),
          0.6,
        );
        sprite(
          smokeTex,
          50,
          towers[3].clone().add(new THREE.Vector3(4, 36, 0)),
          0.8,
        );
        sprite(blueTex, 60, new THREE.Vector3(30, 90, -20), 0.5);
        for (let i = 0; i < 4; i++)
          place(
            cathedral(),
            new THREE.Vector3(
              160 + rr(-60, 60),
              330 + rr(-40, 40),
              -320 + rr(-60, 60),
            ),
            2.6,
            -0.4,
            0.2,
          );
        cam.position.set(-34, 4, 4);
        cam.lookAt(8, 20, -70);
        cam.fov = 54;
        shake = 0.8;
        blur = 0.3;
        grade = 'orange';
      }

      cam.updateProjectionMatrix();

      // ---------- render with shake accumulation and grade ----------
      const out = document.getElementById('out');
      const g = out.getContext('2d');
      const base = cam.quaternion.clone();
      const pos0 = cam.position.clone();
      const N = blur > 0 ? 7 : 1;
      g.fillStyle = '#000';
      g.fillRect(0, 0, W, H);
      for (let i = 0; i < N; i++) {
        const t = N === 1 ? 0 : i / (N - 1) - 0.5;
        cam.position
          .copy(pos0)
          .add(
            new THREE.Vector3(
              t * blur * 1.5,
              t * blur * 0.8 + shake * 0.3 * Math.sin(i * 2.1),
              0,
            ),
          );
        cam.quaternion.copy(base);
        cam.rotateZ(shake * 0.006 * Math.sin(i * 1.7));
        cam.rotateX(shake * 0.004 * Math.cos(i * 2.3));
        renderer.render(scene, cam);
        g.globalAlpha = i === 0 ? 1 : 1 / (i + 1);
        g.drawImage(renderer.domElement, 0, 0);
      }
      g.globalAlpha = 1;
      // grade
      const tint = {
        teal: ['rgba(20,70,90,0.18)', 'rgba(255,140,60,0.06)'],
        orange: ['rgba(120,50,10,0.16)', 'rgba(255,160,80,0.08)'],
        bleach: ['rgba(60,60,60,0.12)', 'rgba(255,220,200,0.10)'],
        cold: ['rgba(30,50,80,0.25)', 'rgba(120,160,200,0.04)'],
      }[grade];
      g.globalCompositeOperation = 'multiply';
      g.fillStyle = 'rgba(200,215,225,1)';
      if (grade === 'orange') g.fillStyle = 'rgba(240,215,190,1)';
      g.fillRect(0, 0, W, H);
      g.globalCompositeOperation = 'screen';
      g.fillStyle = tint[0];
      g.fillRect(0, 0, W, H);
      g.fillStyle = tint[1];
      g.fillRect(0, 0, W, H);
      g.globalCompositeOperation = 'source-over';
      // vignette
      const vg = g.createRadialGradient(
        W / 2,
        H / 2,
        H * 0.35,
        W / 2,
        H / 2,
        W * 0.68,
      );
      vg.addColorStop(0, 'rgba(0,0,0,0)');
      vg.addColorStop(1, 'rgba(0,0,0,0.75)');
      g.fillStyle = vg;
      g.fillRect(0, 0, W, H);
      // grain
      const img = g.getImageData(0, 0, W, H);
      const d = img.data;
      for (let i = 0; i < d.length; i += 4) {
        const n = (rnd() - 0.5) * 26;
        d[i] += n;
        d[i + 1] += n;
        d[i + 2] += n;
      }
      g.putImageData(img, 0, 0);
      document.title = 'done';
    </script>
  </body>
</html>
